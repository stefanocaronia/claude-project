<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Project</title>
<style>
    :root {
        color-scheme: light;
        --page: #f4f3ef;
        --surface: #fcfcfb;
        --surface-2: #f0efea;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --ring: rgba(11, 11, 11, 0.08);
        --accent: #2a78d6;
        --accent-soft: #cde2fb;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-7: #6250d6;
        --good: #0ca30c;
        --warning: #fab219;
        --critical: #d03b3b;
        --never: #d6d5ce;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --page: #0d0d0d;
            --surface: #1a1a19;
            --surface-2: #232321;
            --ink: #f0efec;
            --ink-2: #c3c2b7;
            --muted: #898781;
            --grid: #2c2c2a;
            --axis: #383835;
            --ring: rgba(255, 255, 255, 0.08);
            --accent: #3987e5;
            --accent-soft: #184f95;
            --series-1: #3987e5;
            --series-2: #d95926;
            --series-3: #199e70;
            --series-7: #9085e9;
            --never: #383835;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
        }
    }

    :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --surface-2: #232321;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --ring: rgba(255, 255, 255, 0.08);
        --accent: #3987e5;
        --accent-soft: #184f95;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-7: #9085e9;
        --never: #383835;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px 24px 64px;
    }

    header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.02em;
    }

    h1 span {
        color: var(--muted);
        font-weight: 400;
    }

    h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 620;
    }

    .hint {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
    }

    .meta {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--good);
        display: inline-block;
        margin-right: 6px;
        transition: transform 0.3s;
    }

    .dot.pulse {
        transform: scale(1.8);
    }

    button {
        font: inherit;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--ring);
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
    }

    button:hover {
        color: var(--ink);
    }

    .tabs {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -24px 20px;
        padding: 10px 24px;
        background: color-mix(in srgb, var(--page) 85%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--grid);
    }

    .tabs button {
        flex: none;
        border: 0;
        background: transparent;
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 550;
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .tabs button:hover {
        background: var(--surface-2);
    }

    .tabs button[aria-selected="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
        outline: 1px solid var(--ring);
    }

    .tabs button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .badge {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--ink-2);
    }

    .tabs button[aria-selected="true"] .badge {
        background: var(--accent);
        color: #ffffff;
    }

    .panel[hidden] {
        display: none;
    }

    .state {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--never);
    }

    .state.up {
        background: var(--good);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent);
    }

    .state.warn {
        background: var(--warning);
    }

    .state.starting {
        background: var(--warning);
        animation: blink 1s infinite alternate;
    }

    @keyframes blink {
        to { opacity: 0.3; }
    }

    .actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
    }

    .action {
        font: inherit;
        font-size: 13px;
        font-weight: 560;
        text-decoration: none;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--ring);
        border-radius: 10px;
        padding: 7px 14px;
        cursor: pointer;
    }

    .action.primary {
        background: var(--accent);
        border-color: transparent;
        color: #ffffff;
    }

    .waiting-title {
        margin: 22px 0 2px;
        font-size: 14px;
        font-weight: 620;
    }

    .proposals li {
        padding: 10px 0;
    }

    .proposals label {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 8px;
        cursor: pointer;
    }

    .proposals input {
        margin-top: 3px;
        accent-color: var(--accent);
    }

    .action:disabled {
        opacity: 0.6;
        cursor: progress;
    }

    code {
        font-size: 12px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }

    .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(12, 1fr);
    }

    .card {
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        outline: 1px solid var(--ring);
        padding: 20px;
        min-width: 0;
    }

    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-7 { grid-column: span 7; }
    .span-6 { grid-column: span 6; }
    .span-5 { grid-column: span 5; }
    .span-4 { grid-column: span 4; }

    @media (max-width: 980px) {
        .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
    }

    /* Hero */
    .hero {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
    }

    @media (max-width: 640px) {
        .hero { grid-template-columns: 1fr; justify-items: center; }
    }

    .ring-wrap {
        position: relative;
        width: 196px;
        height: 196px;
    }

    .ring-wrap .value {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
    }

    .ring-wrap .value b {
        font-size: 46px;
        font-weight: 680;
        letter-spacing: -0.03em;
        line-height: 1;
    }

    .ring-wrap .value small {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
    }

    .ring-arc {
        transition: stroke-dashoffset 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        width: 100%;
    }

    .tile {
        background: var(--surface-2);
        border-radius: 12px;
        padding: 14px 16px;
    }

    .tile .label {
        color: var(--ink-2);
        font-size: 13px;
    }

    .tile .number {
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.2;
    }

    .tile .sub {
        color: var(--muted);
        font-size: 12px;
    }

    /* The plan as a roadmap: a rail of phases, each with its epics as cards */
    .roadmap {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .phase-row {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 16px;
    }

    .rail {
        position: relative;
        display: flex;
        justify-content: center;
    }

    .rail::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 14px;
        width: 2px;
        background: var(--grid);
    }

    .phase-row:first-child .rail::before {
        top: 14px;
    }

    .phase-row:last-child .rail::before {
        bottom: auto;
        height: 14px;
    }

    .node {
        position: relative;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        background: var(--surface);
        color: var(--muted);
        border: 2px solid var(--axis);
    }

    .phase-row.active .node {
        color: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .phase-row.complete .node {
        color: #ffffff;
        background: var(--good);
        border-color: var(--good);
    }

    .phase-body {
        min-width: 0;
        padding: 2px 0 26px;
    }

    .phase-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(140px, 260px);
        gap: 6px 20px;
        align-items: center;
    }

    .phase-head h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 640;
        line-height: 1.3;
    }

    .phase-head h3 span {
        color: var(--muted);
        font-weight: 450;
        font-size: 13px;
        margin-right: 8px;
        font-variant-numeric: tabular-nums;
    }

    .phase-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
    }

    .outcome {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--ink-2);
        max-width: 80ch;
    }

    .outcome b {
        font-weight: 600;
        color: var(--muted);
    }

    .phase-row.complete .phase-body, .phase-row.empty .phase-body {
        padding-bottom: 18px;
    }

    .phase-row.complete h3 {
        color: var(--ink-2);
    }

    .epics {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
        gap: 12px;
        margin-top: 14px;
    }

    .epic {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--outline);
        transition: background 0.12s;
    }

    .epic:hover {
        background: var(--card-hover);
    }

    .epic.working {
        box-shadow: inset 3px 0 0 var(--work);
    }

    .epic h4 {
        margin: 0;
        font-size: 15px;
        font-weight: 620;
        line-height: 1.3;
    }

    .epic-go {
        font: inherit;
        color: var(--ink);
        text-align: left;
        background: none;
        border: 0;
        padding: 0;
        border-radius: 4px;
        cursor: pointer;
    }

    /* The whole card is the epic's button; the link to its tasks sits above it. */
    .epic-go::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
    }

    .epic-go:focus-visible {
        outline: none;
    }

    .epic:has(.epic-go:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .epic-go span {
        color: var(--muted);
        font-weight: 400;
        margin-left: 4px;
    }

    .epic-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--ink-2);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .epic-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        margin-top: auto;
        font-size: 12px;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
    }

    .epic-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        font-size: 12px;
        color: var(--muted);
    }

    .epic-foot .to-tasks {
        position: relative;
        z-index: 1;
        margin-left: auto;
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 7px;
        border-color: var(--outline);
        color: var(--ink);
    }

    .epic.out .epic-go {
        color: var(--ink-2);
    }

    .loose {
        margin: 4px 0 0 46px;
        font-size: 13px;
        color: var(--muted);
    }

    .loose button {
        font-size: 13px;
        margin-left: 6px;
    }

    .bar.doing > i {
        background: var(--work);
    }

    @media (max-width: 640px) {
        .phase-row {
            grid-template-columns: 24px minmax(0, 1fr);
            gap: 10px;
        }

        .rail::before {
            left: 11px;
        }

        .node {
            width: 24px;
            height: 24px;
            font-size: 12px;
        }

        .phase-head {
            grid-template-columns: minmax(0, 1fr);
        }

        .loose {
            margin-left: 34px;
        }

        .doc-paper {
            height: 112px;
        }
    }

    .bar {
        height: 8px;
        border-radius: 999px;
        background: var(--grid);
        overflow: hidden;
    }

    .bar > i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        width: 0;
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bar.done > i {
        background: var(--good);
    }

    /* The health's groups */
    .section {
        border-top: 1px solid var(--grid);
    }

    .section:first-child {
        border-top: 0;
    }

    .section > summary {
        list-style: none;
        cursor: pointer;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(160px, 38%) 64px 44px;
        align-items: center;
        gap: 14px;
        padding: 10px 6px;
        border-radius: 8px;
    }

    .section > summary::-webkit-details-marker {
        display: none;
    }

    .section > summary:hover {
        background: var(--surface-2);
    }

    .section .title {
        min-width: 0;
    }

    .section .title b {
        font-weight: 560;
    }

    .section .title span {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
    }

    .section .count, .section .pct {
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: var(--ink-2);
        font-size: 13px;
    }

    .section .pct {
        color: var(--ink);
        font-weight: 600;
    }

    @media (max-width: 640px) {
        .section > summary { grid-template-columns: minmax(0, 1fr) 80px 44px; }
        .section .count { display: none; }
    }

    /* Charts */
    svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    svg text {
        fill: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
    }

    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12px;
        color: var(--ink-2);
        margin: 0 0 10px;
    }

    .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
    }

    [data-tip] {
        cursor: default;
    }

    rect[data-tip]:hover, circle[data-tip]:hover {
        filter: brightness(1.15);
    }

    #tip {
        position: fixed;
        pointer-events: none;
        z-index: 10;
        max-width: 360px;
        background: var(--ink);
        color: var(--surface);
        font-size: 12px;
        line-height: 1.4;
        padding: 8px 10px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.12s;
    }

    #tip b {
        display: block;
        margin-bottom: 2px;
    }

    /* Stacked bars, one row each */
    .coverage-row {
        display: grid;
        grid-template-columns: 150px 1fr 48px;
        gap: 12px;
        align-items: center;
        padding: 5px 0;
        font-size: 13px;
    }

    .stack {
        display: flex;
        gap: 2px;
        height: 14px;
    }

    .stack > span {
        border-radius: 4px;
        min-width: 4px;
    }

    /* Colleagues */
    .crew {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
    }

    .person {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        background: var(--surface-2);
    }

    .person img, .person .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        outline: 2px solid var(--person);
        outline-offset: 2px;
    }

    .person .name {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.2;
    }

    .person .role {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .person .bar {
        height: 5px;
        margin-top: 6px;
    }

    .person .bar > i {
        background: var(--person);
    }

    .person .open {
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 2px;
    }

    /* Lists */
    .list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
    }

    .list li {
        padding: 9px 0;
        border-top: 1px solid var(--grid);
        color: var(--ink-2);
    }

    .list li:first-child {
        border-top: 0;
    }

    .list .tag {
        display: inline-block;
        min-width: 44px;
        font-weight: 600;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
    }

    .clamp {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .list li:hover .clamp {
        -webkit-line-clamp: unset;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    th {
        text-align: left;
        color: var(--muted);
        font-weight: 500;
        padding: 6px 8px;
        border-bottom: 1px solid var(--grid);
    }

    td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--grid);
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
    }

    td:first-child {
        color: var(--ink);
    }

    td.num, th.num {
        text-align: right;
    }

    .scroll {
        max-height: 420px;
        overflow: auto;
    }

    /* The panel's language: Crew's green of work and purple of decisions, a faint gray card with Material's outline. */
    :root {
        --work: #4e9a6b;
        --decision: #8a63c9;
        --outline: #8080803d;
        --card: color-mix(in srgb, var(--ink) 3.5%, var(--surface));
        --card-hover: color-mix(in srgb, var(--ink) 7%, var(--surface));
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .icon {
        display: block;
        flex: none;
    }

    svg.icon {
        width: auto;
        height: auto;
    }

    .face {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        object-fit: cover;
        font-size: 9px;
        font-weight: 650;
        color: #ffffff;
    }

    .face svg {
        width: 22px;
        height: 22px;
    }

    .prio {
        flex: none;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
    }

    button.prio:hover {
        background: var(--outline);
    }

    .effort {
        color: var(--muted);
    }

    .work {
        color: var(--work);
        font-weight: 600;
    }

    /* A release's notes, in its section */
    .release-notes {
        margin: 0 6px 12px;
        font-size: 13px;
    }

    .release-notes h2 {
        font-size: 13px;
        margin: 10px 0 4px;
    }

    /* A large task's parts closed, a chip that shows or folds them */
    .parts-chip {
        border: 0;
        border-radius: 6px;
        padding: 0 6px;
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        background: color-mix(in srgb, var(--ink) 7%, transparent);
        cursor: pointer;
    }

    .parts-chip:hover {
        background: color-mix(in srgb, var(--ink) 12%, transparent);
    }

    .parts-chip.doing {
        color: var(--work);
        background: color-mix(in srgb, var(--work) 15%, transparent);
    }

    /* A task's waits and parts in place of its age, and its links under its text */
    .wait.blocked {
        color: var(--ink-2);
    }

    .task-links {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
    }

    .task-links b {
        font-weight: 600;
        color: var(--ink-2);
    }

    .epic.closed {
        opacity: 0.7;
    }

    /* A task written in the list */
    .task-form textarea {
        width: 100%;
        font: inherit;
        font-size: 13px;
        padding: 6px 8px;
        border: 1px solid var(--axis);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        resize: vertical;
    }

    .form-fields {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin: 8px 0;
        font-size: 12px;
        color: var(--muted);
    }

    .form-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .link-button {
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        color: var(--accent);
        cursor: pointer;
    }

    /* The open GitHub issues not yet in the backlog */
    .issues {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .issue-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-top: 1px solid var(--grid);
        font-size: 13px;
    }

    /* A task's type icon, a due day near or past, a task stuck in progress */
    svg.type-icon {
        display: inline-block;
        flex: none;
        width: 14px;
        height: 14px;
        vertical-align: -2px;
    }

    svg.type-icon text {
        fill: #fff;
        font-size: 8px;
    }

    /* The type and the priority of a task in the list, the priority always in the same place */
    .marks {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
    }

    .wait.late {
        color: var(--critical);
        font-weight: 600;
    }

    .wait.near, .wait.stale {
        color: var(--warning);
    }

    /* A part under its large task, a step in, with a rule on its left */
    .task.part, .row.part {
        margin-left: 18px;
        border-left: 2px solid var(--axis);
    }

    /* A part's face smaller than its large task's */
    .part .face, .part .face svg {
        width: 16px;
        height: 16px;
        font-size: 8px;
    }

    /* The board: a column by state, a lane by goal */
    .board-head, .lane-cells {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
    }

    .board-head {
        position: sticky;
        top: var(--tabs-height, 58px);
        z-index: 2;
        margin: 0 -20px;
        padding: 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--grid);
    }

    .column-name {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
    }

    .column-name .days {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .column-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--axis);
    }

    .column-mark.doing {
        background: var(--work);
    }

    .column-mark.done {
        background: var(--good);
    }

    .lane {
        border-bottom: 1px solid var(--grid);
        scroll-margin-top: calc(var(--tabs-height, 58px) + 52px);
    }

    .lane > summary {
        list-style: none;
        cursor: pointer;
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) minmax(80px, 220px) 52px;
        align-items: center;
        gap: 10px;
        padding: 11px 6px;
        border-radius: 8px;
    }

    .lane > summary::-webkit-details-marker {
        display: none;
    }

    .lane > summary:hover {
        background: var(--surface-2);
    }

    .lane > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
    }

    .chevron {
        width: 0;
        height: 0;
        border-left: 5px solid var(--muted);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform 0.15s;
    }

    .lane[open] .chevron {
        transform: rotate(90deg);
    }

    .lane .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .lane .title b {
        font-weight: 580;
    }

    .lane .title span, .lane .count {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
    }

    .lane .count {
        text-align: right;
        font-variant-numeric: tabular-nums;
        margin: 0;
    }

    .lane-cells {
        padding: 2px 0 16px;
    }

    .cell {
        min-width: 0;
        min-height: 48px;
        border-radius: 10px;
        transition: background 0.12s;
    }

    .cell.can-drop {
        outline: 1px dashed var(--axis);
        outline-offset: 3px;
    }

    .cell.target {
        outline: 2px dashed var(--accent);
        background: color-mix(in srgb, var(--accent-soft) 30%, transparent);
    }

    .cell-name {
        display: none;
    }

    .cell-list, .rows {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .cell-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .task {
        background: var(--card);
        border: 1px solid var(--outline);
        border-radius: 10px;
        padding: 7px 10px 8px;
        display: grid;
        gap: 4px;
        cursor: grab;
        transition: background 0.12s, opacity 0.12s;
    }

    .task:hover {
        background: var(--card-hover);
    }

    .task.doing {
        box-shadow: inset 3px 0 0 var(--work);
    }

    .task.dragging, .task.pending {
        opacity: 0.45;
    }

    .task.landed {
        animation: landed 0.6s ease-out;
    }

    @keyframes landed {
        from { background: color-mix(in srgb, var(--work) 22%, var(--surface)); }
    }

    .task-top, .task-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .task-top .id {
        font-weight: 600;
        color: var(--ink-2);
    }

    .task-top .grow {
        flex: 1;
    }

    .task-text {
        font: inherit;
        font-size: 13px;
        line-height: 1.4;
        text-align: left;
        color: var(--ink);
        background: none;
        border: 0;
        border-radius: 4px;
        padding: 0;
        width: 100%;
        cursor: pointer;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
    }

    .task-text[aria-expanded="true"] {
        -webkit-line-clamp: unset;
    }

    .task.done .task-text, .row.done .task-text {
        color: var(--muted);
    }

    .task.done .task-text {
        -webkit-line-clamp: 2;
    }

    .task.done .task-text[aria-expanded="true"] {
        -webkit-line-clamp: unset;
    }

    .moves {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding-top: 4px;
        font-size: 12px;
        color: var(--muted);
    }

    .task:focus-within .moves, .task.open .moves {
        display: flex;
    }

    .moves button {
        font-size: 12px;
        padding: 2px 9px;
        border-radius: 7px;
        color: var(--ink);
        border-color: var(--outline);
    }

    .moves button:hover {
        background: var(--surface-2);
    }

    @media (max-width: 720px) {
        .board-head {
            display: none;
        }

        .lane > summary {
            grid-template-columns: 12px minmax(0, 1fr) 44px;
            grid-template-areas: "chevron title count" ". bar bar";
            row-gap: 6px;
        }

        .lane .chevron { grid-area: chevron; }
        .lane .title { grid-area: title; white-space: normal; }
        .lane .bar { grid-area: bar; height: 6px; }
        .lane .count { grid-area: count; }

        .lane-cells {
            grid-template-columns: minmax(0, 1fr);
            gap: 14px;
        }

        .cell-name {
            display: flex;
            margin: 0 0 6px 2px;
        }

        .cell:not(:has(.task)) {
            display: none;
        }
    }

    /* The lists of tasks and of decisions */
    .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 22px;
        margin: 0 0 14px;
    }

    .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
    }

    .filter-name {
        font-size: 12px;
        color: var(--muted);
        margin-right: 4px;
    }

    .chips button {
        font-size: 13px;
        padding: 3px 10px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .chips button .count {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .chips button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--surface);
        border-color: var(--ink);
    }

    .chips button[aria-pressed="true"] .count {
        color: inherit;
        opacity: 0.7;
    }

    .filters label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
    }

    select, input[type="search"] {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: 8px;
        padding: 4px 8px;
        max-width: 240px;
    }

    input[type="search"] {
        width: 100%;
        max-width: 440px;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--card);
    }

    .found {
        margin: 0 0 6px;
        font-size: 12px;
        color: var(--muted);
    }

    .search {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        margin: 0 0 12px;
    }

    .search .found {
        margin: 0;
    }

    .row {
        display: grid;
        grid-template-columns: 22px 40px minmax(0, 1fr) 16px;
        gap: 10px;
        align-items: start;
        padding: 10px 4px;
        border-top: 1px solid var(--grid);
    }

    .row:first-child {
        border-top: 0;
    }

    .row > .face, .row > .prio, .row > .effort {
        margin-top: 0;
    }

    .row > .effort {
        padding-top: 5px;
    }

    .row.proposal {
        grid-template-columns: 48px minmax(0, 1fr);
    }

    /* Who decides, and a proposal's priority */
    .row .who {
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .row.decision {
        grid-template-columns: 84px minmax(0, 1fr);
    }

    /* Who decided, beside the decision's number */
    .row.decision .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .row .task-text {
        -webkit-line-clamp: 2;
        padding-top: 1px;
    }

    .row.decision .task-text {
        -webkit-line-clamp: 3;
    }

    .row .task-text[aria-expanded="true"] {
        -webkit-line-clamp: unset;
    }

    .row .id, .row .tag {
        font-weight: 600;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
        margin-right: 6px;
    }

    .row .tag {
        color: var(--decision);
        padding-top: 1px;
        margin: 0;
    }

    .row-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 10px;
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
    }

    .row-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--ink-2);
    }

    .row .why {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--ink-2);
    }

    mark {
        background: color-mix(in srgb, var(--warning) 35%, transparent);
        color: inherit;
        border-radius: 2px;
    }

    .more {
        margin-top: 12px;
    }

    /* The documents: the key ones as a gallery with a page's preview, the others as small cards; the reader opens them */
    .doc-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr));
        gap: 16px;
    }

    .doc-card {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--outline);
        overflow: hidden;
        transition: background 0.12s, transform 0.12s;
    }

    .doc-card:hover {
        background: var(--card-hover);
    }

    .doc-card:has(.doc-open:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .doc-paper {
        height: 168px;
        margin: 12px 12px 0;
        padding: 12px 14px;
        border-radius: 8px 8px 0 0;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        font-size: 9.5px;
        line-height: 1.45;
        color: var(--ink-2);
        overflow-wrap: anywhere;
        mask-image: linear-gradient(to bottom, #000 62%, transparent);
        pointer-events: none;
        user-select: none;
    }

    .doc-paper > :first-child {
        margin-top: 0;
    }

    .doc-paper h2 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--ink);
    }

    .doc-paper h3, .doc-paper h4, .doc-paper h5 {
        font-size: 11px;
        margin: 8px 0 3px;
        color: var(--ink);
    }

    .doc-paper p, .doc-paper ul, .doc-paper ol, .doc-paper blockquote, .doc-paper pre, .doc-paper table {
        margin: 0 0 5px;
    }

    .doc-paper ul, .doc-paper ol {
        padding-left: 12px;
    }

    .doc-paper blockquote {
        padding: 2px 6px;
        border-left: 2px solid var(--axis);
    }

    .doc-paper pre, .doc-paper code {
        font-size: 8.5px;
    }

    .doc-paper table {
        font-size: 8.5px;
    }

    .doc-paper th, .doc-paper td {
        padding: 2px 4px;
    }

    .doc-paper a, .doc-paper .reader-link {
        color: inherit;
        text-decoration: none;
    }

    .doc-paper.empty {
        background: repeating-linear-gradient(to bottom, transparent 0 12px, var(--grid) 12px 13px) var(--surface);
    }

    .doc-info {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
        padding: 14px 16px 4px;
    }

    .doc-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--kind);
        background: color-mix(in srgb, var(--kind) 14%, transparent);
    }

    .doc-icon.small {
        width: 30px;
        height: 30px;
        border-radius: 8px;
    }

    .doc-icon svg {
        width: 20px;
        height: 20px;
    }

    .doc-icon.small svg {
        width: 17px;
        height: 17px;
    }

    .doc-info h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 640;
        line-height: 1.3;
    }

    .doc-open {
        font: inherit;
        color: var(--ink);
        text-align: left;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
    }

    .doc-open::after {
        content: "";
        position: absolute;
        inset: 0;
    }

    .doc-open:focus-visible {
        outline: none;
    }

    .doc-sub {
        margin: 2px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-2);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .doc-meta {
        margin: 0;
        padding: 6px 16px 14px 66px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .doc-card.missing {
        background: transparent;
        border-style: dashed;
    }

    .doc-card.missing .doc-info h3 {
        color: var(--ink-2);
    }

    .doc-shelf {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr));
        gap: 10px;
    }

    .doc-mini {
        position: relative;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-width: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--outline);
    }

    .doc-mini b {
        display: block;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .doc-mini span {
        display: block;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    #reader {
        width: min(860px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
        outline: 1px solid var(--ring);
    }

    #reader[open] {
        display: flex;
        flex-direction: column;
    }

    #reader::backdrop {
        background: rgba(0, 0, 0, 0.45);
    }

    .reader-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--grid);
    }

    .reader-head > div {
        flex: 1;
        min-width: 0;
    }

    .reader-head h2 {
        margin: 0;
        font-size: 18px;
    }

    .reader-path {
        color: var(--muted);
    }

    .reader-plain {
        font-size: 13px;
        color: var(--accent);
        white-space: nowrap;
    }

    .reader-body {
        overflow: auto;
        padding: 8px 28px 28px;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    .reader-body:focus {
        outline: none;
    }

    .reader-body h2 {
        font-size: 22px;
        margin: 22px 0 8px;
    }

    .reader-body > h2:first-child {
        margin-top: 12px;
    }

    .reader-body h3 {
        font-size: 18px;
        margin: 26px 0 6px;
        padding-top: 12px;
        border-top: 1px solid var(--grid);
    }

    .reader-body h4, .reader-body h5, .reader-body h6 {
        font-size: 15px;
        margin: 18px 0 4px;
    }

    .reader-body p, .reader-body ul, .reader-body ol {
        margin: 0 0 10px;
    }

    .reader-body ul, .reader-body ol {
        padding-left: 22px;
    }

    .reader-body li {
        margin: 3px 0;
    }

    .reader-body blockquote {
        margin: 0 0 12px;
        padding: 6px 14px;
        border-left: 3px solid var(--axis);
        color: var(--ink-2);
        background: var(--surface-2);
        border-radius: 0 8px 8px 0;
    }

    .reader-body blockquote.callout {
        border-left-color: var(--decision);
    }

    .reader-body pre {
        overflow: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--surface-2);
    }

    .reader-body :not(pre) > code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--surface-2);
    }

    .reader-body a {
        color: var(--accent);
    }

    .reader-link {
        text-decoration: underline dotted var(--muted);
    }

    .reader-table {
        overflow-x: auto;
        margin: 0 0 12px;
    }

    .reader-body td {
        vertical-align: top;
        font-variant-numeric: normal;
    }

    @media (max-width: 640px) {
        #reader {
            width: 100vw;
            max-width: 100vw;
            height: 100dvh;
            max-height: 100dvh;
            border-radius: 0;
        }

        .reader-head {
            flex-wrap: wrap;
            padding: 12px 16px;
        }

        .reader-head > div {
            flex-basis: 100%;
        }

        .reader-body {

<script>
const colors = { blue: "#3987e5", red: "#e34948", green: "#1baf7a", yellow: "#eda100", purple: "#6250d6", cyan: "#0fa3b1", orange: "#eb6834", pink: "#e87ba4", gray: "#898781" };
const seriesColors = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-7)"];

// The board's columns, the backlog command that moves a task into each, and the turn of a priority, as the panel's.

const moveCommands = { doing: "start", todo: "todo", postponed: "postpone", done: "done" };

const priorityRank = { P1: 1, P2: 2, P3: 3 };

    tasks: ["#4e9a6b", '<rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M7.7 3.5v13M12.3 3.5v13"/>'],
    ideas: ["#c99400", '<path d="M7.2 13.5c0-1.6-2.7-3-2.7-5.6a5.5 5.5 0 0 1 11 0c0 2.6-2.7 4-2.7 5.6z"/><path d="M7.6 16h4.8M8.6 18h2.8"/>'],
    wishes: ["#c99400", '<path d="M10 2.8l2.1 4.4 4.8.6-3.5 3.3.9 4.8L10 13.6l-4.3 2.3.9-4.8-3.5-3.3 4.8-.6z"/>'],
    index: ["#898781", '<circle cx="10" cy="10" r="7"/><path d="M10 9v5"/><circle cx="10" cy="6.4" r="0.7" fill="currentColor"/>'],
    page: ["#898781", '<path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M7.5 10h5M7.5 13h5"/>'],
};
const decisionsShown = 50;
const extensions = [];
const loadedScripts = new Set();
const expanded = new Set();
const lanesOpen = savedLanes();
const taskFilter = { state: "open", priority: "all", type: "all", who: "all", goal: "all" };
// The colors of the task types, as Jira's issue types (lib/schedule.mjs).
const typeColors = { bug: "#E5493A", feature: "#36B37E", chore: "#4C9AFF", research: "#8777D9", test: "#E2852B" };
let words = pageWords.en;
let data = null;
let lastData = "";
let tidyData = null;
let days = [];
let decisionQuery = "";
let decisionLimit = decisionsShown;
let dragging = null;
let renderWaits = false;
let focusAfter = null;
let landed = null;
let announceTimer = 0;
// The task being written in the list: "new", a task's number, or null; while it is, the page does not draw itself again.
let editing = null;
// A large task's parts shown (true) or folded (false), by task number, as the user left them.
const folds = {};
// The documents' texts the page has read, for their previews: by address and the day they changed; those being read.
const documentTexts = new Map();
const documentsReading = new Set();

/** What an extension draws with: the page's helpers, words and data calls. */
const kit = {
    escape, attribute, tile, ring, progressBar, dayBars, formatDay, time, relative, colors, fetchJson, post, t,
    dayRange: () => days,
    get language() {
        return data?.language ?? "en";
    },
    rerender,
};

/** The extensions' entry point: each one's script calls projectPage.register({ id, tabs, tiles, rhythm, mounted, style }). */
window.projectPage = {
    register(extension) {
        if (!extension?.id || extensions.some((one) => one.id === extension.id)) {
            return;
        }

        extensions.push(extension);

        if (extension.style) {
            const style = document.createElement("style");
            style.textContent = extension.style;
            document.head.append(style);
        }

        rerender();
    },
};

setupTheme();
setupTooltip();
setupBoard();
setupReader();
addEventListener("resize", measureTabs);
addEventListener("hashchange", () => {
    const button = document.getElementById(`tab-${location.hash.slice(1).split("/")[0]}`);

    if (button) {
        selectTab(button);
    }

    openAskedDocument();
    openAskedRelease();
});
load();
loadTidy();
setInterval(load, 15000);
setInterval(loadTidy, 4000);

async function load()
{
    let fresh;

    try {
        fresh = await fetchJson("/data");
    } catch {
        return; // the server is restarting: the next poll tries again
    }

    const signature = JSON.stringify({ ...fresh, generated: null });
    const live = document.getElementById("live");
    live.classList.add("pulse");
    setTimeout(() => live.classList.remove("pulse"), 300);

    if (signature === lastData || editing !== null) {
        return;
    }

    lastData = signature;
    data = fresh;
    words = pageWords[data.language] ?? pageWords.en;
    loadExtensions(data.extensions ?? []);
    render();
    openAskedDocument();
    openAskedRelease();
}

/** A word of the page in its language, English when the language lacks it; a word that is a function is called with the values. */
function t(key, ...values)
{
    const word = words[key] ?? pageWords.en[key] ?? key;

    return typeof word === "function" ? word(...values) : word;
}

function loadExtensions(list)
{
    for (const { script } of list) {
        if (script && !loadedScripts.has(script)) {
            loadedScripts.add(script);
            const element = document.createElement("script");
            element.src = script;
            document.body.append(element);
        }
    }
}

function rerender()
{
    if (data) {
        render();
    }
}

function render()
{
    // A card being dragged would be lost under a page drawn again: the drawing waits for the drop.
    if (dragging) {
        renderWaits = true;
        return;
    }

    const { plan, decisions, documents, tasks, health } = data;
    const percent = ratio(plan.done, plan.total);
    const errors = health.filter((finding) => finding.severity === "error").length;
    const focus = focusAfter ?? focusedElement();
    const doing = (data.board ?? []).filter((task) => task.state === "doing").length;
    days = dayRange(data.activity.map((repo) => repo.days), decisions.byDay, plan.finishedByDay);
    // A tooltip of a mark drawn again would stay with what it said before.
    document.getElementById("tip").style.opacity = 0;
    renderChrome();

    const tabs = [
        { id: "overview", label: t("tabOverview"), badge: `${percent}%`, panel: overviewPanel },
        { id: "board", label: t("tabBoard"), badge: doing ? `${doing}` : "", panel: boardPanel },
        { id: "rhythm", label: t("tabRhythm"), badge: "", panel: rhythmPanel },
        { id: "decisions", label: t("tabDecisions"), badge: `${decisions.open.length}`, panel: decisionsPanel },
        { id: "tasks", label: t("tabTasks"), badge: `${(data.board ?? []).filter((task) => columnOf(task) !== "done").length}`, panel: tasksPanel },
        { id: "health", label: t("tabHealth"), badge: errors ? t("errorsBadge", errors) : "✓", panel: healthPanel },
        { id: "documents", label: t("tabDocuments"), badge: `${documents.length}`, panel: documentsPanel },
        { id: "releases", label: t("tabReleases"), badge: data.releases?.list.length ? `v${data.releases.list[0].version}` : "", panel: releasesPanel },
    ];

    for (const extension of extensions) {
        for (const tab of extension.tabs ?? []) {
            const extra = data.extra?.[extension.id];
            const entry = {
                id: String(tab.id).replace(/[^\w-]/g, ""),
                label: guarded(extension, () => (typeof tab.label === "function" ? tab.label(extra, kit) : tab.label), tab.id),
                badge: extra?.error ? "!" : guarded(extension, () => (typeof tab.badge === "function" ? tab.badge(extra, kit) : tab.badge ?? ""), ""),
                panel: () => (extra?.error ? failure(extension, extra.error) : guarded(extension, () => tab.render(extra, kit, data), null, true)),
            };
            const after = tabs.findIndex((one) => one.id === tab.after);
            tabs.splice(after < 0 ? tabs.length : after + 1, 0, entry);
        }
    }

    // A tab by its id after the #; #documents/2 is the documents' tab with the third key document open in the reader.
    const asked = location.hash.slice(1).split("/")[0];
    const active = tabs.some((tab) => tab.id === asked) ? asked : "overview";

    document.getElementById("tabs").innerHTML = tabs.map(({ id, label, badge }) => `<button type="button" role="tab" id="tab-${id}" aria-controls="panel-${id}" aria-selected="${id === active}" tabindex="${id === active ? 0 : -1}">${escape(label)}${badge ? `<span class="badge">${escape(badge)}</span>` : ""}</button>`).join("");
    document.getElementById("app").innerHTML = tabs.map(({ id, panel }) => `<div class="grid panel" role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}" ${id === active ? "" : "hidden"}>${panel()}</div>`).join("");

    requestAnimationFrame(() => {
        document.querySelectorAll("[data-width]").forEach((bar) => (bar.style.width = bar.dataset.width));
        document.querySelectorAll(".ring-arc").forEach((arc) => (arc.style.strokeDashoffset = arc.dataset.offset));
    });
    bindTabs();
    renderTidy();
    measureTabs();
    restoreFocus(focus);
    focusAfter = null;
    landed = null;

    for (const extension of extensions) {
        const extra = data.extra?.[extension.id];

        if (extension.mounted && !extra?.error) {
            guarded(extension, () => extension.mounted(extra, kit, data));
        }
    }
}

/** The header, the title and the labels that do not change with the data, in the page's language. */
function renderChrome()
{
    document.documentElement.lang = data.language ?? "en";
    document.title = t("title", data.project);
    document.getElementById("heading").innerHTML = `${escape(data.project)} <span>· ${escape(t("subtitle"))}</span>`;
    document.getElementById("meta").textContent = t("meta", formatDay(data.plan.updated), time(data.generated));
    document.getElementById("live-label").textContent = t("live");
    document.getElementById("theme").textContent = t("theme");
    document.getElementById("tabs").setAttribute("aria-label", t("tabsLabel"));
}

/** What an extension gives, or a card that says it failed: one extension never breaks the page. */
function guarded(extension, draw, fallback = "", asCard = false)
{
    try {
        return draw();
    } catch (error) {
        console.error(`Extension ${extension.id}:`, error);
        return asCard ? failure(extension, error?.message ?? error) : fallback;
    }
}

function failure(extension, message)
{
    return `<section class="card span-12"><p class="hint" style="margin:0;color:var(--critical)">${escape(t("extensionFailed", extension.id, String(message)))}</p></section>`;
}

function extensionParts(part)
{
    return extensions.map((extension) => {
        const extra = data.extra?.[extension.id];

        if (!extension[part] || extra?.error) {
            return "";
        }

        const drawn = guarded(extension, () => extension[part](extra, kit, data));

        return Array.isArray(drawn) ? drawn.join("") : drawn ?? "";
    }).join("");
}

function overviewPanel()
{
    const { plan, decisions, activity } = data;
    const percent = ratio(plan.done, plan.total);
    const project = activity[0];
    const commits = project ? Object.values(project.days).reduce((sum, count) => sum + count, 0) : 0;

    return `<section class="card span-12">
            <div class="hero">
                ${ring(percent, t("ringCaption", plan.done, plan.total))}
                <div class="tiles">
                    ${tile(t("tileDecisions"), decisions.count, t("tileDecisionsSub", sumSince(decisions.byDay, 7)))}
                    ${tile(t("tileOpen"), decisions.open.length, t("tileOpenSub"))}
                    ${project ? tile(t("tileCommits"), commits, t("tileCommitsSub", project.name, Object.keys(project.days).length)) : ""}
                    ${data.releases ? tile(t("tileVersion"), data.releases.list[0] ? `v${data.releases.list[0].version}` : "—", t("tileVersionSub", data.releases.pending.length, data.releases.suggested.version)) : ""}
                    ${extensionParts("tiles")}
                </div>
            </div>
        </section>

        ${roadmap()}`;
}

/** The releases: what waits for the next one and why one is due, then each version, the newest first, with its notes. */
function releasesPanel()
{
    const { list = [], pending = [], counts = {}, suggested = {}, closedGoals = [], urgent = [] } = data.releases ?? {};
    const name = (id) => `${data.prefixes.task}-${id}`;
    const due = closedGoals.length ? t("releaseDueGoals", closedGoals.join(", ")) : urgent.length ? t("releaseDueFix", urgent.join(", ")) : t("releaseJudge");
    const waiting = pending.length
        ? `<p>${escape(t("releasePending", pending.length, counts))} ${escape(t("releaseSuggested", suggested.version))}</p>
            <p class="hint">${escape(due)}</p>
            <ul class="list">${pending.map((task) => `<li><span class="id">${escape(name(task.id))}</span> ${escape(task.text)}</li>`).join("")}</ul>`
        : `<p class="hint">${escape(t("releaseNothing"))}</p>`;
    const notes = (release) => markdown(withoutFrontmatter(release.text).replace(/^#[^\n]*\n/, ""));

    return `<section class="card span-12">
            <h2>${t("releaseNextTitle")}</h2>
            ${waiting}
        </section>

        <section class="card span-12">
            <h2>${t("releasesTitle")}</h2>
            <p class="hint">${escape(t("releasesHint"))}</p>
            ${list.map((release, index) => `<details class="section release" id="release-${attribute(release.version)}" ${index === 0 ? "open" : ""}>
                <summary><div class="title"><b>v${escape(release.version)}</b> <span class="hint">${escape(formatDay(release.day))}</span>${release.summary ? ` · ${escape(release.summary)}` : ""}</div><div></div><div class="count"></div><div class="pct">${escape(t("releaseTasks", release.count))}</div></summary>
                <div class="release-notes">${notes(release)}</div>
            </details>`).join("") || `<p class="hint">${escape(t("releasesNone"))}</p>`}
        </section>`;
}

/** The release the address asks for, #releases/0.8.0 (the panel's links), opened and brought into view once. */
function openAskedRelease()
{
    const asked = /^#releases\/v?([\d.]+)$/.exec(location.hash);
    const release = asked ? document.getElementById(`release-${asked[1]}`) : null;

    if (release) {
        history.replaceState(null, "", "#releases");
        release.open = true;
        release.scrollIntoView({ block: "start" });
    }
}

/** The plan as a roadmap: the phases of its table in their order, each with its bar, what it lets you do, and its epics as cards in the
 * plan's order; the epics of no phase after, as the cross-cutting ones. */
function roadmap()
{
    const { plan } = data;
    const noGoal = data.words.noGoal;
    const epics = plan.sections.filter((section) => section.name !== noGoal);
    const phased = new Set(plan.phases.map((phase) => phase.number));
    const across = epics.filter((section) => !phased.has(section.phase));
    const loose = (data.board ?? []).filter((task) => (!task.goal || task.goal === noGoal) && columnOf(task) !== "done").length;
    const rows = plan.phases.map((phase) => phaseRow(phase, epics.filter((section) => section.phase === phase.number)));

    if (across.length) {
        const done = across.reduce((sum, section) => sum + section.done, 0);
        const total = across.reduce((sum, section) => sum + section.total, 0);
        rows.push(phaseRow({ number: null, name: t("acrossTitle"), outcome: "", done, total }, across));
    }

    return `<section class="card span-12">
            <h2>${t("planTitle")}</h2>
            <p class="hint">${t("planHint")}</p>
            <ol class="roadmap">${rows.join("")}</ol>
            ${loose ? `<p class="loose">${escape(t("looseTasks", loose))}<button type="button" data-go-lane="">${t("toBoard")}</button></p>` : ""}
        </section>`;
}

function phaseRow(phase, epics)
{
    const percent = ratio(phase.done, phase.total);
    // A phase is complete when its tasks are all done, or its goals all closed.
    const complete = phase.isClosed || (phase.total > 0 && phase.done === phase.total);
    const status = complete ? "complete" : phase.total === 0 ? "empty" : "active";
    const working = epics.some((section) => section.items.some((item) => item.state === "doing"));
    const words = complete ? t("phaseClosed") : phase.total === 0 ? t("phaseNotStarted") : t("phaseProgress", phase.done, phase.total, percent);
    const node = phase.number === null ? "∗" : complete ? "✓" : phase.number;
    const label = phase.number === null ? escape(phase.name) : `<span>${escape(t("phase", phase.number))}</span> ${escape(phase.name)}`;
    const outcome = phase.outcome ? `<p class="outcome"><b>${t("phaseOutcome")}</b> ${escape(phase.outcome)}</p>` : phase.number === null ? `<p class="outcome">${t("acrossHint")}</p>` : "";

    return `<li class="phase-row ${status}">
            <div class="rail"><span class="node" aria-hidden="true">${node}</span></div>
            <div class="phase-body">
                <div class="phase-head">
                    <h3>${label}</h3>
                    <div class="phase-progress">${phase.total ? bar(percent, complete ? "done" : working ? "doing" : "", t("laneDone", phase.done, phase.total)) : "<span></span>"}<span>${escape(words)}</span></div>
                </div>
                ${outcome}
                ${epics.length ? `<div class="epics">${epics.map(epicCard).join("")}</div>` : ""}
            </div>
        </li>`;
}

/** An epic of the plan: its name, what it is, its bar, its open tasks and those in progress; the card opens its lane on the board. */
function epicCard(section)
{
    const open = section.items.filter((item) => !item.done).length;
    const doing = section.items.filter((item) => item.state === "doing").length;
    const complete = section.total > 0 && section.done === section.total;
    const percent = ratio(section.done, section.total);
    const note = /\((.*)\)$/.exec(section.title)?.[1];
    const description = section.description ? `<p class="epic-text" data-tip="${attribute(escape(section.description))}">${escape(section.description)}</p>` : "";
    const counts = [doing ? `<span class="work">⚒︎ ${escape(t("epicDoing", doing))}</span>` : "", `<span>${escape(section.closed ? t("epicClosed", formatDay(section.closed)) : open ? t("epicOpen", open) : t("epicAllDone"))}</span>`].join("");

    return `<article class="epic ${doing ? "working" : ""} ${section.isUnplanned ? "out" : ""} ${section.closed ? "closed" : ""}">
            <h4><button type="button" class="epic-go" data-go-lane="${attribute(section.name)}" aria-label="${attribute(t("epicToBoard", section.name))}">${escape(section.name)}${section.isUnplanned ? `<span>· ${escape(t("outOfPlan"))}</span>` : note && section.phase === null ? `<span>· ${escape(note)}</span>` : ""}</button></h4>
            ${description}
            <div class="epic-bar">${bar(percent, complete ? "done" : doing ? "doing" : "", t("laneDone", section.done, section.total))}<span>${section.done}/${section.total}</span></div>
            <div class="epic-foot">${counts}<button type="button" class="to-tasks" data-go-tasks="${attribute(section.name)}">${t("epicTasks")}</button></div>
        </article>`;
}

/** A progress bar that says its numbers to a screen reader; kind is "done", "doing" or nothing. */
function bar(percent, kind, label)
{
    return `<div class="bar ${kind}" role="img" aria-label="${attribute(label)}"><i data-width="${percent}%"></i></div>`;
}

/** Opens an epic's lane on the board, or, when the board has none, its tasks in the list. */
function goToLane(name)
{
    lanesOpen[name] = true;
    saveLanes();
    selectTab(document.getElementById("tab-board"));
    const lane = [...document.querySelectorAll("details.lane")].find((one) => one.dataset.lane === name);

    if (!lane) {
        goToTasks(name, "all");
        return;
    }

    lane.open = true;
    lane.scrollIntoView({ block: "start" });
    lane.querySelector("summary").focus({ preventScroll: true });
}

function goToTasks(name, state = "open")
{
    Object.assign(taskFilter, { state, priority: "all", who: "all", goal: name || "all" });
    selectTab(document.getElementById("tab-tasks"));
    refreshTaskList("filter-goal");
}

function rhythmPanel()
{
    const { plan, decisions, activity } = data;
    const repos = activity.map((repo, index) => ({ name: repo.name, color: seriesColors[index % seriesColors.length], values: repo.days }));
    const legend = repos.length > 1 ? `<div class="legend">${repos.map((repo) => `<span><i style="background:${repo.color}"></i>${escape(repo.name)}</span>`).join("")}</div>` : "";

    return `<section class="card span-6">
            <h2>${t("rhythmDecisions")}</h2>
            <p class="hint">${t("rhythmDecisionsHint")}</p>
            ${dayBars(days, [{ name: t("seriesDecisions"), color: "var(--series-7)", values: decisions.byDay }], 190)}
        </section>

        <section class="card span-6">
            <h2>${t("rhythmCommits")}</h2>
            ${legend}
            ${dayBars(days, repos, 190)}
        </section>

        <section class="card span-6">
            <h2>${t("rhythmDone")}</h2>
            <p class="hint">${t("rhythmDoneHint")}</p>
            ${dayBars(days, [{ name: t("seriesDone"), color: "var(--series-3)", values: plan.finishedByDay }], 190)}
        </section>
        ${extensionParts("rhythm")}`;
}

function decisionsPanel()
{
    const { decisions, prefixes } = data;
    const people = Object.entries(decisions.byPerson ?? {}).sort(([, first], [, second]) => second - first);
    const byPerson = people.length ? t("byPerson", people.map(([name, count]) => `${name} ${count}`).join(", ")) : "";

    const proposals = sortedProposals();

    return `<section class="card span-12">
            <h2>${t("openTitle")}</h2>
            <p class="hint">${t("proposalsHint", proposals.length)}</p>
            <ul class="rows">${proposals.map(proposalRow).join("") || `<li class="row proposal"><span></span><span class="hint">${t("openNone")}</span></li>`}</ul>
        </section>

        <section class="card span-12">
            <h2>${t("allTitle")}</h2>
            <p class="hint">${escape(byPerson)}${numberingNote(decisions, prefixes.decision)}</p>
            <div class="search">
                <label for="decision-search" class="visually-hidden">${t("searchLabel")}</label>
                <input type="search" id="decision-search" value="${attribute(decisionQuery)}" placeholder="${attribute(t("searchPlaceholder"))}" autocomplete="off" spellcheck="false">
                <p class="found" id="decision-found">${escape(foundLine(matchingDecisions().length))}</p>
            </div>
            <div id="decision-list">${decisionListBody()}</div>
        </section>`;
}

/** The proposals waiting, as the panel orders them: by priority, those without one last, then the oldest, then by their place. */
function sortedProposals()
{
    const rank = (proposal) => priorityRank[proposal.priority] ?? 4;

    return (data.decisions.proposals ?? []).slice().sort((first, second) => rank(first) - rank(second) || (first.day ?? "9999").localeCompare(second.day ?? "9999") || first.line - second.line);
}

function proposalRow(proposal)
{
    const id = `proposal-${proposal.line}`;
    const meta = [proposal.day ? `<span data-tip="${attribute(escape(formatDay(proposal.day)))}">${escape(age(proposal.day))}</span>` : "", `<span>${escape(t("lineAt", proposal.line))}</span>`];

    return `<li class="row proposal">
            <span class="who">${decider() ? face({ to: decider() }) : ""}${proposal.priority ? `<span class="prio" role="img" aria-label="${attribute(priorityName(proposal.priority))}">${priorityMark(proposal.priority)}</span>` : ""}</span>
            <div>${expandButton(id, escape(proposal.text))}<div class="row-meta">${meta.join("")}</div></div>
        </li>`;
}

/** The decisions that hold every word of the search, accents and case aside; all of them without one. */
function matchingDecisions()
{
    const terms = searchTerms(decisionQuery);
    const prefix = data.prefixes.decision;

    return data.decisions.all.filter((row) => {
        const text = folded(`${prefix}-${row.number} ${row.text} ${row.why ?? ""}`);
        return terms.every((term) => text.includes(term));
    });
}

function decisionListBody()
{
    const found = matchingDecisions();
    const terms = searchTerms(decisionQuery);
    const rest = found.length - decisionLimit;
    const rows = found.slice(0, decisionLimit).map((row) => decisionRow(row, terms)).join("");

    return `<ul class="rows">${rows || `<li class="row decision"><span></span><span class="hint">${t("decisionsNone")}</span></li>`}</ul>
        ${rest > 0 ? `<button type="button" class="more" id="decisions-more">${escape(t("showMore", Math.min(rest, 100), rest))}</button>` : ""}`;
}

function decisionRow(row, terms)
{
    const id = `decision-${row.number}`;
    const open = expanded.has(id);
    const why = open && row.why ? `<p class="why"><b>${t("why")}</b> ${marked(row.why, terms)}</p>` : "";
    const tasks = row.tasks?.length ? `<span><b>${escape(t("decisionTasks"))}</b> ${escape(row.tasks.join(", "))}</span>` : "";
    const day = row.day || tasks ? `<div class="row-meta">${row.day ? `<span>${escape(formatDay(row.day))}</span>` : ""}${tasks}</div>` : "";

    return `<li class="row decision">
            <span class="tag">${decider() ? face({ to: decider() }) : ""}${escape(data.prefixes.decision)}-${row.number}</span>
            <div>${expandButton(id, marked(row.text, terms))}${why}${day}</div>
        </li>`;
}

/** Who decides: the owner, else the first person of the project who is not Claude. */
function decider()
{
    return data.owner?.name ?? (data.people ?? []).find((person) => person !== "Claude") ?? null;
}

function foundLine(count)
{
    const total = data.decisions.all.length;

    return decisionQuery.trim() ? t("decisionsFound", count, total) : t("decisionsCount", total);
}

/** A text that opens and closes itself: clamped to a few lines, whole once pressed. */
function expandButton(id, html)
{
    return `<button type="button" class="task-text" id="${id}" data-expand="${id}" aria-expanded="${expanded.has(id)}">${html}</button>`;
}
