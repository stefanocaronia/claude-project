<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Project</title>
<style>
    :root {
        color-scheme: light;
        --page: #f4f3ef;
        --surface: #fcfcfb;
        --surface-2: #f0efea;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --ring: rgba(11, 11, 11, 0.08);
        --accent: #2a78d6;
        --accent-soft: #cde2fb;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --series-3: #1baf7a;
        --series-7: #6250d6;
        --good: #0ca30c;
        --warning: #fab219;
        --critical: #d03b3b;
        --never: #d6d5ce;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --page: #0d0d0d;
            --surface: #1a1a19;
            --surface-2: #232321;
            --ink: #f0efec;
            --ink-2: #c3c2b7;
            --muted: #898781;
            --grid: #2c2c2a;
            --axis: #383835;
            --ring: rgba(255, 255, 255, 0.08);
            --accent: #3987e5;
            --accent-soft: #184f95;
            --series-1: #3987e5;
            --series-2: #d95926;
            --series-3: #199e70;
            --series-7: #9085e9;
            --never: #383835;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
        }
    }

    :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --surface-2: #232321;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --ring: rgba(255, 255, 255, 0.08);
        --accent: #3987e5;
        --accent-soft: #184f95;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-7: #9085e9;
        --never: #383835;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 28px 24px 64px;
    }

    header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.02em;
    }

    h1 span {
        color: var(--muted);
        font-weight: 400;
    }

    h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 620;
    }

    .hint {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
    }

    .meta {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--good);
        display: inline-block;
        margin-right: 6px;
        transition: transform 0.3s;
    }

    .dot.pulse {
        transform: scale(1.8);
    }

    button {
        font: inherit;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--ring);
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
    }

    button:hover {
        color: var(--ink);
    }

    .tabs {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 -24px 20px;
        padding: 10px 24px;
        background: color-mix(in srgb, var(--page) 85%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--grid);
    }

    .tabs button {
        flex: none;
        border: 0;
        background: transparent;
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 550;
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .tabs button:hover {
        background: var(--surface-2);
    }

    .tabs button[aria-selected="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
        outline: 1px solid var(--ring);
    }

    .tabs button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .badge {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--ink-2);
    }

    .tabs button[aria-selected="true"] .badge {
        background: var(--accent);
        color: #ffffff;
    }

    .panel[hidden] {
        display: none;
    }

    .state {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--never);
    }

    .state.up {
        background: var(--good);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent);
    }

    .state.warn {
        background: var(--warning);
    }

    .state.starting {
        background: var(--warning);
        animation: blink 1s infinite alternate;
    }

    @keyframes blink {
        to { opacity: 0.3; }
    }

    .actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
    }

    .action {
        font: inherit;
        font-size: 13px;
        font-weight: 560;
        text-decoration: none;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--ring);
        border-radius: 10px;
        padding: 7px 14px;
        cursor: pointer;
    }

    .action.primary {
        background: var(--accent);
        border-color: transparent;
        color: #ffffff;
    }

    .waiting-title {
        margin: 22px 0 2px;
        font-size: 14px;
        font-weight: 620;
    }

    .proposals li {
        padding: 10px 0;
    }

    .proposals label {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 8px;
        cursor: pointer;
    }

    .proposals input {
        margin-top: 3px;
        accent-color: var(--accent);
    }

    .action:disabled {
        opacity: 0.6;
        cursor: progress;
    }

    code {
        font-size: 12px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }

    .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(12, 1fr);
    }

    .card {
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        outline: 1px solid var(--ring);
        padding: 20px;
        min-width: 0;
    }

    .span-12 { grid-column: span 12; }
    .span-8 { grid-column: span 8; }
    .span-7 { grid-column: span 7; }
    .span-6 { grid-column: span 6; }
    .span-5 { grid-column: span 5; }
    .span-4 { grid-column: span 4; }

    @media (max-width: 980px) {
        .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
    }

    /* Hero */
    .hero {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
    }

    @media (max-width: 640px) {
        .hero { grid-template-columns: 1fr; justify-items: center; }
    }

    .ring-wrap {
        position: relative;
        width: 196px;
        height: 196px;
    }

    .ring-wrap .value {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
    }

    .ring-wrap .value b {
        font-size: 46px;
        font-weight: 680;
        letter-spacing: -0.03em;
        line-height: 1;
    }

    .ring-wrap .value small {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
    }

    .ring-arc {
        transition: stroke-dashoffset 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        width: 100%;
    }

    .tile {
        background: var(--surface-2);
        border-radius: 12px;
        padding: 14px 16px;
    }

    .tile .label {
        color: var(--ink-2);
        font-size: 13px;
    }

    .tile .number {
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.2;
    }

    .tile .sub {
        color: var(--muted);
        font-size: 12px;
    }

    /* Phases */
    .phases {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
    }

    @media (max-width: 980px) {
        .phases { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    }

    .phase {
        border-radius: 12px;
        padding: 14px;
        background: var(--surface-2);
        position: relative;
        overflow: hidden;
    }

    .phase .num {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    .phase .name {
        font-weight: 600;
        margin: 2px 0 10px;
        line-height: 1.25;
        min-height: 2.5em;
    }

    .phase .status {
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 8px;
    }

    .phase.complete .status::before {
        content: "✓ ";
        color: var(--good);
        font-weight: 700;
    }

    .bar {
        height: 8px;
        border-radius: 999px;
        background: var(--grid);
        overflow: hidden;
    }

    .bar > i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        width: 0;
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bar.done > i {
        background: var(--good);
    }

    /* Plan sections */
    .sections {
        display: flex;
        flex-direction: column;
    }

    .section {
        border-top: 1px solid var(--grid);
    }

    .section:first-child {
        border-top: 0;
    }

    .section > summary {
        list-style: none;
        cursor: pointer;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(160px, 38%) 64px 44px;
        align-items: center;
        gap: 14px;
        padding: 10px 6px;
        border-radius: 8px;
    }

    .section > summary::-webkit-details-marker {
        display: none;
    }

    .section > summary:hover {
        background: var(--surface-2);
    }

    .section .title {
        min-width: 0;
    }

    .section .title b {
        font-weight: 560;
    }

    .section .title span {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
    }

    .section .count, .section .pct {
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: var(--ink-2);
        font-size: 13px;
    }

    .section .pct {
        color: var(--ink);
        font-weight: 600;
    }

    @media (max-width: 640px) {
        .section > summary { grid-template-columns: minmax(0, 1fr) 80px 44px; }
        .section .count { display: none; }
    }

    .items {
        margin: 0 6px 12px;
        padding: 0;
        list-style: none;
        font-size: 13px;
        color: var(--ink-2);
    }

    .items li {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 6px;
        padding: 4px 0;
    }

    .items li.child {
        margin-left: 26px;
    }

    .items .mark {
        font-weight: 700;
        color: var(--muted);
    }

    .items li.doing .mark {
        color: var(--accent);
    }

    .items .who {
        color: var(--muted);
    }

    .items li.done .mark {
        color: var(--good);
    }

    .items li.done .text {
        color: var(--muted);
    }

    .items .text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .items li:hover .text {
        -webkit-line-clamp: unset;
    }

    .filter {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
    }

    .filter button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--surface);
    }

    /* Charts */
    svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
    }

    svg text {
        fill: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
    }

    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12px;
        color: var(--ink-2);
        margin: 0 0 10px;
    }

    .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
    }

    [data-tip] {
        cursor: default;
    }

    rect[data-tip]:hover, circle[data-tip]:hover {
        filter: brightness(1.15);
    }

    #tip {
        position: fixed;
        pointer-events: none;
        z-index: 10;
        max-width: 360px;
        background: var(--ink);
        color: var(--surface);
        font-size: 12px;
        line-height: 1.4;
        padding: 8px 10px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.12s;
    }

    #tip b {
        display: block;
        margin-bottom: 2px;
    }

    /* Stacked bars, one row each */
    .coverage-row {
        display: grid;
        grid-template-columns: 150px 1fr 48px;
        gap: 12px;
        align-items: center;
        padding: 5px 0;
        font-size: 13px;
    }

    .stack {
        display: flex;
        gap: 2px;
        height: 14px;
    }

    .stack > span {
        border-radius: 4px;
        min-width: 4px;
    }

    /* Colleagues */
    .crew {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
    }

    .person {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        background: var(--surface-2);
    }

    .person img, .person .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        outline: 2px solid var(--person);
        outline-offset: 2px;
    }

    .person .name {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.2;
    }

    .person .role {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .person .bar {
        height: 5px;
        margin-top: 6px;
    }

    .person .bar > i {
        background: var(--person);
    }

    .person .open {
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 2px;
    }

    /* Lists */
    .list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
    }

    .list li {
        padding: 9px 0;
        border-top: 1px solid var(--grid);
        color: var(--ink-2);
    }

    .list li:first-child {
        border-top: 0;
    }

    .list .tag {
        display: inline-block;
        min-width: 44px;
        font-weight: 600;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
    }

    .clamp {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .list li:hover .clamp {
        -webkit-line-clamp: unset;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    th {
        text-align: left;
        color: var(--muted);
        font-weight: 500;
        padding: 6px 8px;
        border-bottom: 1px solid var(--grid);
    }

    td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--grid);
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
    }

    td:first-child {
        color: var(--ink);
    }

    td.num, th.num {
        text-align: right;
    }

    .scroll {
        max-height: 420px;
        overflow: auto;
    }

    /* The panel's language: Crew's green of work and purple of decisions, a faint gray card with Material's outline. */
    :root {
        --work: #4e9a6b;
        --decision: #8a63c9;
        --outline: #8080803d;
        --card: color-mix(in srgb, var(--ink) 3.5%, var(--surface));
        --card-hover: color-mix(in srgb, var(--ink) 7%, var(--surface));
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .icon {
        display: block;
        flex: none;
    }

    svg.icon {
        width: auto;
        height: auto;
    }

    .face {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        object-fit: cover;
        font-size: 9px;
        font-weight: 650;
        color: #ffffff;
    }

    .face svg {
        width: 22px;
        height: 22px;
    }

    .prio {
        flex: none;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
    }

    button.prio:hover {
        background: var(--outline);
    }

    .effort {
        color: var(--muted);
    }

    .work {
        color: var(--work);
        font-weight: 600;
    }

    /* The board: a column by state, a lane by goal */
    .board-head, .lane-cells {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
    }

    .board-head {
        position: sticky;
        top: var(--tabs-height, 58px);
        z-index: 2;
        margin: 0 -20px;
        padding: 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--grid);
    }

    .column-name {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
    }

    .column-name .days {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .column-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--axis);
    }

    .column-mark.doing {
        background: var(--work);
    }

    .column-mark.done {
        background: var(--good);
    }

    .lane {
        border-bottom: 1px solid var(--grid);
    }

    .lane > summary {
        list-style: none;
        cursor: pointer;
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) minmax(80px, 220px) 52px;
        align-items: center;
        gap: 10px;
        padding: 11px 6px;
        border-radius: 8px;
    }

    .lane > summary::-webkit-details-marker {
        display: none;
    }

    .lane > summary:hover {
        background: var(--surface-2);
    }

    .lane > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
    }

    .chevron {
        width: 0;
        height: 0;
        border-left: 5px solid var(--muted);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform 0.15s;
    }

    .lane[open] .chevron {
        transform: rotate(90deg);
    }

    .lane .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .lane .title b {
        font-weight: 580;
    }

    .lane .title span, .lane .count {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
    }

    .lane .count {
        text-align: right;
        font-variant-numeric: tabular-nums;
        margin: 0;
    }

    .lane .bar.doing > i {
        background: var(--work);
    }

    .lane-cells {
        padding: 2px 0 16px;
    }

    .cell {
        min-width: 0;
        min-height: 48px;
        border-radius: 10px;
        transition: background 0.12s;
    }

    .cell.can-drop {
        outline: 1px dashed var(--axis);
        outline-offset: 3px;
    }

    .cell.target {
        outline: 2px dashed var(--accent);
        background: color-mix(in srgb, var(--accent-soft) 30%, transparent);
    }

    .cell-name {
        display: none;
    }

    .cell-list, .rows {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .cell-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .task {
        background: var(--card);
        border: 1px solid var(--outline);
        border-radius: 10px;

<body>
<main>
    <header>
        <div>
            <h1 id="heading"></h1>
            <div class="meta" id="meta"></div>
        </div>
        <div class="meta">

            <button id="theme" type="button"></button>
        </div>
    </header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="app"></div>
</main>
<div id="tip" role="tooltip"></div>
<div id="announce" class="visually-hidden" role="status"></div>
<dialog id="reader" aria-labelledby="reader-title">
    <header class="reader-head">
        <div><h2 id="reader-title"></h2><code class="reader-path"></code></div>
        <a class="reader-plain" target="_blank" rel="noopener"></a>
        <button type="button" class="reader-close action"></button>
    </header>
    <div class="reader-body" tabindex="0" autofocus></div>
</dialog>
<script src="/words.js"></script>
<script>
const colors = { blue: "#3987e5", red: "#e34948", green: "#1baf7a", yellow: "#eda100", purple: "#6250d6", cyan: "#0fa3b1", orange: "#eb6834", pink: "#e87ba4", gray: "#898781" };
const seriesColors = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-7)"];
const priorityOrder = ["P1", "P2", "P3", "none"];
const priorityColors = { P1: "#184f95", P2: "#3987e5", P3: "#9ec5f4", none: "var(--never)" };
const stateMarks = { done: "✓", doing: "◐", todo: "○", postponed: "–" };
// The board's columns, the backlog command that moves a task into each, and the turn of a priority, as the panel's.
const boardStates = ["doing", "todo", "postponed", "done"];
const moveCommands = { doing: "start", todo: "todo", postponed: "postpone", done: "done" };
const nextPriority = { P1: "P2", P2: "P3", P3: "P1" };
const priorityRank = { P1: 1, P2: 2, P3: 3 };
// Crew's marks: a priority as an issue tracker draws it, the effort as four bars, a colleague's color for their initials.
const priorityMarks = {
    P1: `<path d="M3.5 7.5L7 4l3.5 3.5M3.5 11L7 7.5l3.5 3.5" stroke="#E5493A"/>`,
    P2: `<path d="M3 5.5h8M3 8.5h8" stroke="#E2852B"/>`,
    P3: `<path d="M3.5 5.5L7 9l3.5-3.5" stroke="#4C8FE0"/>`,
};
const effortBars = { low: 1, medium: 2, high: 3, xhigh: 4, max: 4 };
const tints = { red: "#b42318", blue: "#1d4ed8", green: "#15803d", yellow: "#8a6100", purple: "#7e22ce", orange: "#c2410c", pink: "#be185d", cyan: "#0e7490" };
const critter = claudeCritter();
const decisionsShown = 50;
const extensions = [];
const loadedScripts = new Set();
const openSections = new Set();
const expanded = new Set();
const lanesOpen = savedLanes();
const taskFilter = { state: "open", priority: "all", who: "all", goal: "all" };
let words = pageWords.en;
let data = null;
let lastData = "";
let tidyData = null;
let sectionFilter = "all";
let days = [];
let decisionQuery = "";
let decisionLimit = decisionsShown;
let dragging = null;
let renderWaits = false;
let focusAfter = null;
let landed = null;
let announceTimer = 0;

/** What an extension draws with: the page's helpers, words and data calls. */
const kit = {
    escape, attribute, tile, ring, progressBar, dayBars, formatDay, time, relative, colors, fetchJson, post, t,
    dayRange: () => days,
    get language() {
        return data?.language ?? "en";
    },
    rerender,
};

/** The extensions' entry point: each one's script calls projectPage.register({ id, tabs, tiles, rhythm, mounted, style }). */
window.projectPage = {
    register(extension) {
        if (!extension?.id || extensions.some((one) => one.id === extension.id)) {
            return;
        }

        extensions.push(extension);

        if (extension.style) {
            const style = document.createElement("style");
            style.textContent = extension.style;
            document.head.append(style);
        }

        rerender();
    },
};

setupTheme();
setupTooltip();
setupBoard();
setupReader();
addEventListener("resize", measureTabs);
addEventListener("hashchange", () => {
    const button = document.getElementById(`tab-${location.hash.slice(1)}`);

    if (button) {
        selectTab(button);
    }
});
load();
loadTidy();
setInterval(load, 15000);
setInterval(loadTidy, 4000);

async function load()
{
    let fresh;

    try {
        fresh = await fetchJson("/data");
    } catch {
        return; // the server is restarting: the next poll tries again
    }

    const signature = JSON.stringify({ ...fresh, generated: null });
    const live = document.getElementById("live");
    live.classList.add("pulse");
    setTimeout(() => live.classList.remove("pulse"), 300);

    if (signature === lastData) {
        return;
    }

    lastData = signature;
    data = fresh;
    words = pageWords[data.language] ?? pageWords.en;
    loadExtensions(data.extensions ?? []);
    render();
}

/** A word of the page in its language, English when the language lacks it; a word that is a function is called with the values. */
function t(key, ...values)
{
    const word = words[key] ?? pageWords.en[key] ?? key;

    return typeof word === "function" ? word(...values) : word;
}

function loadExtensions(list)
{
    for (const { script } of list) {
        if (script && !loadedScripts.has(script)) {
            loadedScripts.add(script);
            const element = document.createElement("script");
            element.src = script;
            document.body.append(element);
        }
    }
}

function rerender()
{
    if (data) {
        render();
    }
}

function render()
{
    // A card being dragged would be lost under a page drawn again: the drawing waits for the drop.
    if (dragging) {
        renderWaits = true;
        return;
    }

    const { plan, decisions, documents, tasks, health } = data;
    const percent = ratio(plan.done, plan.total);
    const errors = health.filter((finding) => finding.severity === "error").length;
    const focus = focusAfter ?? focusedElement();
    const doing = (data.board ?? []).filter((task) => task.state === "doing").length;
    days = dayRange(data.activity.map((repo) => repo.days), decisions.byDay, plan.finishedByDay);
    // A tooltip of a mark drawn again would stay with what it said before.
    document.getElementById("tip").style.opacity = 0;
    renderChrome();

    const tabs = [
        { id: "overview", label: t("tabOverview"), badge: `${percent}%`, panel: overviewPanel },
        { id: "board", label: t("tabBoard"), badge: doing ? `${doing}` : "", panel: boardPanel },
        { id: "rhythm", label: t("tabRhythm"), badge: "", panel: rhythmPanel },
        { id: "decisions", label: t("tabDecisions"), badge: `${decisions.open.length}`, panel: decisionsPanel },
        { id: "tasks", label: t("tabTasks"), badge: `${(data.board ?? []).filter((task) => columnOf(task) !== "done").length}`, panel: tasksPanel },
        { id: "health", label: t("tabHealth"), badge: errors ? t("errorsBadge", errors) : "✓", panel: healthPanel },
        { id: "documents", label: t("tabDocuments"), badge: `${documents.length}`, panel: documentsPanel },
    ];

    for (const extension of extensions) {
        for (const tab of extension.tabs ?? []) {
            const extra = data.extra?.[extension.id];
            const entry = {
                id: String(tab.id).replace(/[^\w-]/g, ""),
                label: guarded(extension, () => (typeof tab.label === "function" ? tab.label(extra, kit) : tab.label), tab.id),
                badge: extra?.error ? "!" : guarded(extension, () => (typeof tab.badge === "function" ? tab.badge(extra, kit) : tab.badge ?? ""), ""),
                panel: () => (extra?.error ? failure(extension, extra.error) : guarded(extension, () => tab.render(extra, kit, data), null, true)),
            };
            const after = tabs.findIndex((one) => one.id === tab.after);
            tabs.splice(after < 0 ? tabs.length : after + 1, 0, entry);
        }
    }

    const asked = location.hash.slice(1);
    const active = tabs.some((tab) => tab.id === asked) ? asked : "overview";

    document.getElementById("tabs").innerHTML = tabs.map(({ id, label, badge }) => `<button type="button" role="tab" id="tab-${id}" aria-controls="panel-${id}" aria-selected="${id === active}" tabindex="${id === active ? 0 : -1}">${escape(label)}${badge ? `<span class="badge">${escape(badge)}</span>` : ""}</button>`).join("");
    document.getElementById("app").innerHTML = tabs.map(({ id, panel }) => `<div class="grid panel" role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}" ${id === active ? "" : "hidden"}>${panel()}</div>`).join("");

    requestAnimationFrame(() => {
        document.querySelectorAll("[data-width]").forEach((bar) => (bar.style.width = bar.dataset.width));
        document.querySelectorAll(".ring-arc").forEach((arc) => (arc.style.strokeDashoffset = arc.dataset.offset));
    });
    bindSections();
    bindTabs();
    renderTidy();
    measureTabs();
    restoreFocus(focus);
    focusAfter = null;
    landed = null;

    for (const extension of extensions) {
        const extra = data.extra?.[extension.id];

        if (extension.mounted && !extra?.error) {
            guarded(extension, () => extension.mounted(extra, kit, data));
        }
    }
}

/** The header, the title and the labels that do not change with the data, in the page's language. */
function renderChrome()
{
    document.documentElement.lang = data.language ?? "en";
    document.title = t("title", data.project);
    document.getElementById("heading").innerHTML = `${escape(data.project)} <span>· ${escape(t("subtitle"))}</span>`;
    document.getElementById("meta").textContent = t("meta", formatDay(data.plan.updated), time(data.generated));
    document.getElementById("live-label").textContent = t("live");
    document.getElementById("theme").textContent = t("theme");
    document.getElementById("tabs").setAttribute("aria-label", t("tabsLabel"));
}

/** What an extension gives, or a card that says it failed: one extension never breaks the page. */
function guarded(extension, draw, fallback = "", asCard = false)
{
    try {
        return draw();
    } catch (error) {
        console.error(`Extension ${extension.id}:`, error);
        return asCard ? failure(extension, error?.message ?? error) : fallback;
    }
}

function failure(extension, message)
{
    return `<section class="card span-12"><p class="hint" style="margin:0;color:var(--critical)">${escape(t("extensionFailed", extension.id, String(message)))}</p></section>`;
}

function extensionParts(part)
{
    return extensions.map((extension) => {
        const extra = data.extra?.[extension.id];

        if (!extension[part] || extra?.error) {
            return "";
        }

        const drawn = guarded(extension, () => extension[part](extra, kit, data));

        return Array.isArray(drawn) ? drawn.join("") : drawn ?? "";
    }).join("");
}

function overviewPanel()
{
    const { plan, decisions, activity } = data;
    const percent = ratio(plan.done, plan.total);
    const project = activity[0];
    const commits = project ? Object.values(project.days).reduce((sum, count) => sum + count, 0) : 0;

    return `<section class="card span-12">
            <div class="hero">
                ${ring(percent, t("ringCaption", plan.done, plan.total))}
                <div class="tiles">
                    ${tile(t("tileDecisions"), decisions.count, t("tileDecisionsSub", sumSince(decisions.byDay, 7)))}
                    ${tile(t("tileOpen"), decisions.open.length, t("tileOpenSub"))}
                    ${project ? tile(t("tileCommits"), commits, t("tileCommitsSub", project.name, Object.keys(project.days).length)) : ""}
                    ${extensionParts("tiles")}
                </div>
            </div>
        </section>

        <section class="card span-12">
            <h2>${t("phasesTitle")}</h2>
            <p class="hint">${t("phasesHint")}</p>
            <div class="phases">${plan.phases.map(phaseCard).join("")}</div>
        </section>

        <section class="card span-12">
            <h2>${t("goalsTitle")}</h2>

/** The proposals waiting, as the panel orders them: by priority, those without one last, then the oldest, then by their place. */
function sortedProposals()
{
    const rank = (proposal) => priorityRank[proposal.priority] ?? 4;

    return (data.decisions.proposals ?? []).slice().sort((first, second) => rank(first) - rank(second) || (first.day ?? "9999").localeCompare(second.day ?? "9999") || first.line - second.line);
}

function proposalRow(proposal)
{
    const id = `proposal-${proposal.line}`;
    const meta = [proposal.day ? `<span data-tip="${attribute(escape(formatDay(proposal.day)))}">${escape(age(proposal.day))}</span>` : "", `<span>${escape(t("lineAt", proposal.line))}</span>`];

    return `<li class="row proposal">
            ${proposal.priority ? `<span class="prio" role="img" aria-label="${attribute(priorityName(proposal.priority))}">${priorityMark(proposal.priority)}</span>` : "<span></span>"}
            <div>${expandButton(id, escape(proposal.text))}<div class="row-meta">${meta.join("")}</div></div>
        </li>`;

/** The decisions that hold every word of the search, accents and case aside; all of them without one. */
function matchingDecisions()
{
    const terms = searchTerms(decisionQuery);
    const prefix = data.prefixes.decision;

    return data.decisions.all.filter((row) => {
        const text = folded(`${prefix}-${row.number} ${row.text} ${row.why ?? ""}`);
        return terms.every((term) => text.includes(term));
    });
}

function decisionListBody()
{
    const found = matchingDecisions();
    const terms = searchTerms(decisionQuery);
    const rest = found.length - decisionLimit;
    const rows = found.slice(0, decisionLimit).map((row) => decisionRow(row, terms)).join("");

    return `<ul class="rows">${rows || `<li class="row decision"><span></span><span class="hint">${t("decisionsNone")}</span></li>`}</ul>
        ${rest > 0 ? `<button type="button" class="more" id="decisions-more">${escape(t("showMore", Math.min(rest, 100), rest))}</button>` : ""}`;
}

function decisionRow(row, terms)
{
    const id = `decision-${row.number}`;
    const open = expanded.has(id);
    const why = open && row.why ? `<p class="why"><b>${t("why")}</b> ${marked(row.why, terms)}</p>` : "";
    const day = row.day ? `<div class="row-meta"><span>${escape(formatDay(row.day))}</span></div>` : "";

    return `<li class="row decision">
            <span class="tag">${escape(data.prefixes.decision)}-${row.number}</span>
            <div>${expandButton(id, marked(row.text, terms))}${why}${day}</div>
        </li>`;
}

function foundLine(count)
{
    const total = data.decisions.all.length;

    return decisionQuery.trim() ? t("decisionsFound", count, total) : t("decisionsCount", total);
}

/** A text that opens and closes itself: clamped to a few lines, whole once pressed. */

/** The board: a column for each state, a lane for each goal of the plan in its order and, last, the tasks without one. */
function boardPanel()
{
    const tasks = boardTasks();
    const lanes = boardLanes(tasks);
    const head = boardStates.map((state) => {
        const count = tasks.filter((task) => columnOf(task) === state).length;
        const note = state === "done" ? `<span class="days">${escape(t("lastDays", data.boardDays))}</span>` : "";
        return `<div class="column-name"><i class="column-mark ${state}"></i>${escape(stateName(state))}<span class="badge">${count}</span>${note}</div>`;
    }).join("");

    return `<section class="card span-12">
            <h2>${t("boardTitle")}</h2>
            <p class="hint">${escape(t("boardHint", data.boardDays))}</p>
            <div class="board-head" aria-hidden="true">${head}</div>
            ${lanes.map(laneBlock).join("") || `<p class="hint">${t("boardEmpty")}</p>`}
        </section>`;
}

/** The backlog's tasks the board shows: the open ones, and the done ones of its last days. */
function boardTasks()
{
    const since = dayIso(-data.boardDays);

    return (data.board ?? []).filter((task) => columnOf(task) !== "done" || (task.done ?? task.archived ?? "9999") >= since);
}

function boardLanes(tasks)
{
    const goalOf = (task) => (task.goal && task.goal !== data.words.noGoal ? task.goal : "");
    const sections = data.plan.sections.filter((section) => section.name !== data.words.noGoal);
    const names = [...new Set([...sections.map((section) => section.name), ...tasks.map(goalOf).filter(Boolean), ""])];

    return names.map((name) => {
        const own = tasks.filter((task) => goalOf(task) === name);
        const section = sections.find((one) => one.name === name);
        const done = section?.done ?? own.filter((task) => columnOf(task) === "done").length;
        const total = section?.total ?? own.length;
        return { name, title: name ? section?.title ?? name : t("noGoalLane"), own, done, total };
    }).filter((lane) => lane.own.length > 0);
}

function laneBlock(lane)
{
    const percent = ratio(lane.done, lane.total);
    const working = lane.own.some((task) => task.state === "doing");
    const open = lanesOpen[lane.name] ?? lane.own.some((task) => columnOf(task) !== "done");
    const [, name, note] = /^(.*?)(?:\s*\((.*)\))?$/.exec(lane.title);
    const cells = boardStates.map((state) => laneCell(lane, state)).join("");

    return `<details class="lane" data-lane="${attribute(lane.name)}" ${open ? "open" : ""}>
            <summary>
                <span class="chevron" aria-hidden="true"></span>
                <span class="title"><b>${escape(name)}</b>${note ? ` <span>${escape(note)}</span>` : ""}</span>
                <div class="bar ${lane.done === lane.total && lane.total > 0 ? "done" : working ? "doing" : ""}" role="img" aria-label="${attribute(t("laneDone", lane.done, lane.total))}"><i data-width="${percent}%"></i></div>
                <span class="count" aria-hidden="true">${lane.done}/${lane.total}</span>
            </summary>
            <div class="lane-cells">${cells}</div>
        </details>`;
}

function laneCell(lane, state)
{
    const recent = (first, second) => (second.done ?? second.archived ?? "").localeCompare(first.done ?? first.archived ?? "") || second.id - first.id;
    const own = lane.own.filter((task) => columnOf(task) === state).sort(state === "done" ? recent : taskOrder);
    const label = `${stateName(state)} · ${lane.name || t("noGoalLane")}`;

    return `<div class="cell" data-state="${state}" data-lane="${attribute(lane.name)}">
            <div class="cell-name column-name" aria-hidden="true"><i class="column-mark ${state}"></i>${escape(stateName(state))}<span class="badge">${own.length}</span></div>
            <ul class="cell-list" aria-label="${attribute(label)}">${own.map((task) => taskCard(task, lane.name)).join("")}</ul>
        </div>`;
}

/** A task on the board: its priority, number, effort and who holds it; its text, which opens; where it can move, once it has the focus. */
function taskCard(task, lane)
{
    const name = taskName(task);
    const column = columnOf(task);
    const held = column === "doing" ? data.holds?.[String(task.id)] : null;
    const worker = held?.colleague ? data.colleagues.find((person) => person.id === held.colleague) : null;
    const foot = worker || held?.colleague
        ? `<span class="work" data-tip="${attribute(escape(t("atWork")))}">⚒︎ ${escape((worker?.name ?? held.colleague).split(" ")[0])}</span>`
        : column === "done" ? `<span>✓ ${escape(formatDay(task.done ?? task.archived))}</span>` : `<span data-tip="${attribute(escape(t("bornOn", formatDay(task.created))))}">${escape(age(task.created))}</span>`;
    const moves = boardStates.filter((state) => state !== column)
        .map((state) => `<button type="button" id="move-${name}-${state}" data-move="${state}" data-task="${task.id}" aria-label="${attribute(t("moveTo", name, stateName(state)))}">${escape(stateName(state))}</button>`).join("");

    return `<li class="task ${column} ${expanded.has(`board-${name}`) ? "open" : ""} ${landed === task.id ? "landed" : ""}" draggable="true" data-task="${task.id}" data-lane="${attribute(lane)}" data-column="${column}">
            <div class="task-top">${priorityControl(task, "board")}<span class="id">${escape(name)}</span><span class="grow"></span>${effortMeter(task)}${face(task)}</div>
            ${expandButton(`board-${name}`, escape(task.text))}
            <div class="task-foot">${foot}</div>
            <div class="moves" role="group" aria-label="${attribute(t("moveGroup", name))}"><span aria-hidden="true">${escape(t("moveLabel"))}</span>${moves}</div>
        </li>`;
}

/** The filters of the list of tasks: state and priority as buttons that stay pressed, who and goal as menus. */
function taskFilters()
{
    const all = data.board ?? [];
    const countOf = (keep) => all.filter(keep).length;
    const chip = (kind, value, label, count) => `<button type="button" id="filter-${kind}-${value}" data-task-filter="${kind}" data-value="${value}" aria-pressed="${taskFilter[kind] === value}">${label}${count === undefined ? "" : `<span class="count">${count}</span>`}</button>`;
    const states = [["open", t("filterOpenTasks"), (task) => columnOf(task) !== "done"], ...boardStates.map((state) => [state, escape(stateName(state)), (task) => columnOf(task) === state]), ["all", t("filterEvery"), () => true]];
    const priorities = [chip("priority", "all", t("filterAnyPriority")), ...["P1", "P2", "P3"].map((key) => chip("priority", key, `${priorityMark(key)}${escape(key)}`, countOf((task) => task.priority === key && columnOf(task) !== "done")))];
    const people = [...new Set(all.map((task) => task.to))].sort((first, second) => countOf((task) => task.to === second) - countOf((task) => task.to === first));
    const goals = [...new Set([...data.plan.sections.map((section) => section.name), ...all.map((task) => task.goal)])].filter((goal) => goal !== data.words.noGoal && all.some((task) => task.goal === goal));
    const option = (kind, value, label) => `<option value="${attribute(value)}" ${taskFilter[kind] === value ? "selected" : ""}>${escape(label)}</option>`;
    const noGoal = all.some((task) => task.goal === data.words.noGoal) ? option("goal", data.words.noGoal, t("noGoalLane")) : "";

    return `<div class="chips" role="group" aria-labelledby="filter-state-name"><span class="filter-name" id="filter-state-name">${t("filterState")}</span>${states.map(([value, label, keep]) => chip("state", value, label, countOf(keep))).join("")}</div>
        <div class="chips" role="group" aria-labelledby="filter-priority-name"><span class="filter-name" id="filter-priority-name">${t("filterPriority")}</span>${priorities.join("")}</div>
        <label>${t("filterWho")} <select id="filter-who" data-task-filter="who">${option("who", "all", t("anyone"))}${people.map((person) => option("who", person, person)).join("")}</select></label>
        <label>${t("filterGoal")} <select id="filter-goal" data-task-filter="goal">${option("goal", "all", t("anyGoal"))}${goals.map((goal) => option("goal", goal, goal)).join("")}${noGoal}</select></label>`;
}

/** Every task the filters keep, as the panel orders them: in progress, to do, postponed, each by priority and then the oldest; the done
 * last, the latest first. */
function filteredTasks()
{
    const keep = (task) => {
        const column = columnOf(task);
        const state = taskFilter.state === "all" || (taskFilter.state === "open" ? column !== "done" : column === taskFilter.state);
        return state && (taskFilter.priority === "all" || task.priority === taskFilter.priority) && (taskFilter.who === "all" || task.to === taskFilter.who) && (taskFilter.goal === "all" || task.goal === taskFilter.goal);
    };
    const closedLast = (first, second) => boardStates.indexOf(columnOf(first)) - boardStates.indexOf(columnOf(second));
    const recent = (first, second) => (columnOf(first) === "done" ? (second.done ?? second.archived ?? "").localeCompare(first.done ?? first.archived ?? "") : 0);

    return (data.board ?? []).filter(keep).sort((first, second) => closedLast(first, second) || recent(first, second) || taskOrder(first, second));
}

function taskListBody()
{
    const tasks = filteredTasks();
    const rows = tasks.map(taskRow).join("");
    const filtered = Object.entries(taskFilter).some(([kind, value]) => value !== (kind === "state" ? "open" : "all"));

    return `<p class="found">${escape(t("listCount", tasks.length))}${filtered ? ` · <button type="button" id="filters-clear" data-clear-filters>${t("clearFilters")}</button>` : ""}</p>
        <ul class="rows">${rows || `<li class="row"><span></span><span></span><span class="hint">${t("listNone")}</span></li>`}</ul>`;
}

function taskRow(task)
{
    const name = taskName(task);
    const column = columnOf(task);
    const held = column === "doing" ? data.holds?.[String(task.id)] : null;
    const worker = held?.colleague ? data.colleagues.find((person) => person.id === held.colleague) : null;
    const goal = task.goal && task.goal !== data.words.noGoal ? `<span>${escape(task.goal)}</span>` : "";
    const when = column === "done" ? `<span>✓ ${escape(formatDay(task.done ?? task.archived))}</span>` : `<span data-tip="${attribute(escape(t("bornOn", formatDay(task.created))))}">${escape(age(task.created))}</span>`;
    const work = worker || held?.colleague ? `<span class="work">⚒︎ ${escape((worker?.name ?? held.colleague).split(" ")[0])}</span>` : "";

    return `<li class="row ${column}">
            ${face(task)}
            ${priorityControl(task, "list")}
            <div>${expandButton(`list-${name}`, `<span class="id">${escape(name)}</span>${escape(task.text)}`)}
                <div class="row-meta"><span class="row-state"><i class="column-mark ${column}"></i>${escape(stateName(column))}</span>${work}${goal}${when}</div>
            </div>
            ${effortMeter(task) || "<span></span>"}
        </li>`;
}

/** Puts the board's hands on the page once: drags, the moves, the priorities, the texts that open, the filters and the search. */
function setupBoard()
{
    const app = document.getElementById("app");

    app.addEventListener("click", (event) => {
        const target = event.target.closest?.("button");

        if (!target) {
            return;
        }

        if (target.dataset.move) {
            moveTask(target.dataset.task, target.dataset.move, true);
        } else if (target.dataset.priority) {
            turnPriority(target.dataset.priority, target.dataset.next, target.id);
        } else if (target.dataset.expand) {
            toggleText(target);
        } else if (target.dataset.taskFilter) {
            taskFilter[target.dataset.taskFilter] = target.dataset.value;
            refreshTaskList(target.id);
        } else if (target.hasAttribute("data-clear-filters")) {
            Object.assign(taskFilter, { state: "open", priority: "all", who: "all", goal: "all" });
            refreshTaskList("filter-state-open");
        } else if (target.dataset.document) {
            openDocument(Number(target.dataset.document), target);
        } else if (target.id === "decisions-more") {
            const first = matchingDecisions()[decisionLimit];
            decisionLimit += 100;
            document.getElementById("decision-list").innerHTML = decisionListBody();
            document.getElementById(first ? `decision-${first.number}` : "decision-search")?.focus();
        }
    });
    app.addEventListener("change", (event) => {
        if (event.target.matches?.("select[data-task-filter]")) {
            taskFilter[event.target.dataset.taskFilter] = event.target.value;
            refreshTaskList(event.target.id);
        }
    });
    app.addEventListener("input", (event) => {
        if (event.target.id === "decision-search") {
            decisionQuery = event.target.value;
            decisionLimit = decisionsShown;
            document.getElementById("decision-list").innerHTML = decisionListBody();
            const found = foundLine(matchingDecisions().length);
            document.getElementById("decision-found").textContent = found;
            announce(found, 600);
        }
    });
    // A goal's lane, opened or closed by hand, stays so; toggle does not bubble, so it is caught on its way down.
    app.addEventListener("toggle", (event) => {
        if (event.target.matches?.("details.lane")) {
            lanesOpen[event.target.dataset.lane] = event.target.open;
            saveLanes();
        }
    }, true);
    app.addEventListener("dragstart", (event) => {
        const card = event.target.closest?.(".task[draggable]");

        if (!card) {
            return;
        }

        dragging = { card, id: card.dataset.task, lane: card.dataset.lane, from: card.dataset.column };
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", taskName({ id: card.dataset.task }));
        requestAnimationFrame(() => card.classList.add("dragging"));
        document.querySelectorAll(".cell").forEach((cell) => cell.classList.toggle("can-drop", cell.dataset.lane === dragging.lane && cell.dataset.state !== dragging.from));
    });
    app.addEventListener("dragover", (event) => {
        const cell = dragging && event.target.closest?.(".cell.can-drop");

        if (cell) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
        }

        document.querySelectorAll(".cell.target").forEach((other) => other !== cell && other.classList.remove("target"));
        cell?.classList.add("target");
    });
    app.addEventListener("drop", (event) => {
        const cell = dragging && event.target.closest?.(".cell.can-drop");

        if (!cell) {
            return;
        }

        event.preventDefault();
        dragging.card.classList.add("pending");
        cell.querySelector(".cell-list").prepend(dragging.card);
        dragging.dropped = cell.dataset.state;
    });
    app.addEventListener("dragend", () => {
        const { card, id, dropped } = dragging ?? {};
        card?.classList.remove("dragging");
        document.querySelectorAll(".cell.can-drop, .cell.target").forEach((cell) => cell.classList.remove("can-drop", "target"));
        dragging = null;

        if (dropped) {
            moveTask(id, dropped, false);
        } else if (renderWaits) {
            renderWaits = false;
            render();
        }
    });
}

/** Moves a task to a column through the backlog's command; from the keys, the focus follows the card to its new column. */
function moveTask(id, state, byKeys)
{
    const task = data.board.find((one) => String(one.id) === String(id));

    if (!task || columnOf(task) === state) {
        return;
    }

    const name = taskName(task);
    focusAfter = byKeys ? { id: `board-${name}`, scroll: true } : null;
    landed = task.id;
    changeTask({ command: moveCommands[state], id: name }, t("moved", name, stateName(state)));
}

function turnPriority(id, next, buttonId)
{
    const name = taskName({ id });
    focusAfter = { id: buttonId };
    changeTask({ command: "set", id: name, priority: next }, t("priorityNow", name, priorityName(next)));
}

/** Asks the page's server to change the backlog; a refusal is shown with its message. The page reads the project again after. */
async function changeTask(payload, done)
{
    let answer;

    try {
        const response = await fetch("/backlog", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        answer = await response.json().catch(() => ({ ok: false, message: `${response.status} ${response.statusText}` }));
    } catch (error) {
        answer = { ok: false, message: String(error?.message ?? error) };
    }

    if (answer.ok) {
        announce(done);
    } else {
        focusAfter = null;
        landed = null;
        alert(t("failed", answer.message));
    }

    renderWaits = false;
    lastData = "";
    await load();
}

function toggleText(button)
{
    const id = button.dataset.expand;
    const open = !expanded.has(id);
    open ? expanded.add(id) : expanded.delete(id);
    button.setAttribute("aria-expanded", open);
    button.closest(".task")?.classList.toggle("open", open);

    // A decision's reasons show only while it is open.
    if (id.startsWith("decision-")) {
        document.getElementById("decision-list").innerHTML = decisionListBody();
        document.getElementById(id)?.focus();
    }
}

function refreshTaskList(focusId)
{
    document.getElementById("task-filters").innerHTML = taskFilters();
    document.getElementById("task-list").innerHTML = taskListBody();
    document.getElementById(focusId)?.focus();
    announce(t("listCount", filteredTasks().length));
}

/** A priority as Crew draws it: a button that turns it, P1, P2, P3 and P1 again; only a mark on a task already done. */
function priorityControl(task, where)
{
    const key = task.priority;
    const name = priorityName(key);

    if (columnOf(task) === "done" || !priorityMarks[key]) {
        return `<span class="prio" role="img" aria-label="${attribute(name)}" data-tip="${attribute(escape(name))}">${priorityMark(key)}</span>`;
    }

    const next = nextPriority[key];
    const id = `${where}-priority-${taskName(task)}`;

    return `<button type="button" class="prio" id="${id}" data-priority="${task.id}" data-next="${next}" aria-label="${attribute(t("priorityTurn", taskName(task), name, priorityName(next)))}" data-tip="${attribute(`<b>${escape(name)}</b>${escape(t("priorityClick", priorityName(next)))}`)}">${priorityMark(key)}</button>`;
}

/** A priority's arrows, a drawing only: whatever holds it says the priority in words. */
function priorityMark(key)
{
    const mark = priorityMarks[key];

    return mark ? `<svg class="icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${mark}</svg>` : "";
}

/** «P1, high priority», in the project's words. */
function priorityName(key)
{
    return key ? `${key}, ${t("priorityName", data.words.priorities[key] ?? key)}` : t("noPriority");
}

/** The effort a task needs as four bars, low to max; nothing for none. */
function effortMeter(task)
{
    const filled = effortBars[task.effortKey];

    if (!filled) {
        return "";
    }

    const bars = [0, 1, 2, 3].map((index) => `<rect x="${index * 4}" y="1" width="3" height="10" rx="1" fill="currentColor" fill-opacity="${index < filled ? 1 : 0.3}"/>`).join("");
    const label = t("effortName", task.effort);

    return `<span class="effort" role="img" aria-label="${attribute(label)}" data-tip="${attribute(escape(label))}"><svg class="icon" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">${bars}</svg></span>`;
}

/** Who holds a task: Claude's critter, a colleague's portrait or initials on their color, a person's initials in gray. */
function face(task)
{
    const person = task.colleague ? data.colleagues.find((one) => one.id === task.colleague) : null;
    const name = person?.name ?? task.to;
    const tip = `data-tip="${attribute(`<b>${escape(name)}</b>${person ? escape(person.role) : ""}`)}"`;

    if (task.to === "Claude") {
        return `<span class="face" role="img" aria-label="Claude" ${tip}>${critter}</span>`;
    }

    if (person?.hasPortrait) {
        return `<img class="face" src="/portrait/${attribute(person.id)}" alt="${attribute(name)}" ${tip}>`;
    }

    const initials = String(name).split(/\s+/).map((part) => part[0] ?? "").join("").slice(0, 2).toUpperCase();
    const color = person ? tints[person.color] ?? "#6b6b67" : "#8a8a86";

    return `<span class="face" role="img" aria-label="${attribute(name)}" style="background:${color}" ${tip}>${escape(initials)}</span>`;
}

/** Claude: an orange pixel critter on a round cream background, as Crew draws it. */
function claudeCritter()
{
    const rows = [".X........X.", "..X......X..", "..XXXXXXXX..", ".XXXXXXXXXX.", ".XXEEXXEEXX.", "XXXEEXXEEXXX", "XXXXXXXXXXXX", ".XXXXXXXXXX.", "..X.X..X.X..", "..X.X..X.X.."];
    const runs = rows.flatMap((row, y) => [...row.matchAll(/X+|E+/g)].map((run) => `<rect x="${run.index + 2}" y="${y + 3}" width="${run[0].length}" height="1" fill="${run[0][0] === "E" ? "#2B1D17" : "#D97757"}"/>`));

    return `<svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#F3E6DC"/><g shape-rendering="crispEdges">${runs.join("")}</g></svg>`;
}

/** The column a task sits in: an archived task is a done one. */
function columnOf(task)
{
    return task.state === "archived" ? "done" : task.state;
}

function stateName(state)
{
    return data.words.states[state] ?? state;
}

function taskName(task)
{
    return `${data.prefixes.task}-${task.id}`;
}

/** The panel's order: by priority, then the oldest, then by number. */
function taskOrder(first, second)
{
    return (priorityRank[first.priority] ?? 4) - (priorityRank[second.priority] ?? 4) || (first.created ?? "").localeCompare(second.created ?? "") || first.id - second.id;
}

/** How old a day is, «3 d», as the panel says it. */
function age(day)
{
    return day ? t("ageDays", Math.max(0, Math.round((Date.parse(dayIso(0)) - Date.parse(day)) / 86400000))) : "";
}

/** Today, or so many days from it, as YYYY-MM-DD in the local calendar. */
function dayIso(offset)
{
    const day = new Date();
    day.setDate(day.getDate() + offset);

    return `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
}

function searchTerms(query)
{
    return folded(query).split(/\s+/).filter(Boolean);
}

/** A text for searching: lower case, without accents. */
function folded(text)
{
    return String(text).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
}

/** A text, escaped, with the search's words marked where they appear, accents and case aside. */
function marked(text, terms)
{
    if (terms.length === 0) {
        return escape(text);
    }

    // Folding keeps one character a letter, so a place in the folded text is the same place in the text.
    const letters = [...String(text)];
    const plain = letters.map((letter) => folded(letter));
    const hits = new Array(letters.length).fill(false);

    for (const term of terms) {
        const whole = plain.join("");
        let from = whole.indexOf(term);

        while (from >= 0) {
            let at = 0;

            for (let index = 0; index < letters.length; index++) {
                if (at >= from && at < from + term.length) {
                    hits[index] = true;
                }

                at += plain[index].length;
            }

            from = whole.indexOf(term, from + term.length);
        }
    }

    return letters.map((letter, index) => {
        const open = hits[index] && !hits[index - 1] ? "<mark>" : "";
        const close = hits[index] && !hits[index + 1] ? "</mark>" : "";
        return `${open}${escape(letter)}${close}`;
    }).join("");
}

/** The element that has the focus, by its id, with the caret of a field; null when nothing of the page's has it. */
function focusedElement()
{
    const element = document.activeElement;

    if (!element?.id || !element.closest?.("#app, #tabs")) {
        return null;
    }

    return { id: element.id, start: element.selectionStart ?? null, end: element.selectionEnd ?? null };
}

function restoreFocus(focus)
{
    const element = focus && document.getElementById(focus.id);

    if (!element) {
        return;
    }

    element.focus({ preventScroll: !focus.scroll });

    if (focus.start !== null && focus.start !== undefined && element.setSelectionRange) {
        element.setSelectionRange(focus.start, focus.end);
    }

    if (focus.scroll) {
        element.scrollIntoView({ block: "nearest" });
    }
}

/** Says a change to a screen reader; with a delay, only the last of a quick run is said. */
function announce(text, delay = 0)
{
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => {
        document.getElementById("announce").textContent = text;
    }, delay);
}

/** The tabs' height, under which the board's column names stay. */
function measureTabs()
{
    document.documentElement.style.setProperty("--tabs-height", `${document.getElementById("tabs").offsetHeight}px`);
}

{

    const key = data.keyDocuments ?? [];
    const keyCards = key.length ? `<section class="card span-12">
            <h2>${t("keyTitle")}</h2>

    return `${keyCards}<section class="card span-12">
