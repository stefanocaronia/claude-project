/** The board: a column for each state, a lane for each goal of the plan in its order and, last, the tasks without one. */
function boardPanel()
{
    const tasks = boardTasks();
    const lanes = boardLanes(tasks);
    const head = boardStates.map((state) => {
        const count = tasks.filter((task) => columnOf(task) === state).length;
        const note = state === "done" ? `<span class="days">${escape(t("lastDays", data.boardDays))}</span>` : "";
        return `<div class="column-name"><i class="column-mark ${state}"></i>${escape(stateName(state))}<span class="badge">${count}</span>${note}</div>`;
    }).join("");

    return `<section class="card span-12">
            <h2>${t("boardTitle")}</h2>
            <p class="hint">${escape(t("boardHint", data.boardDays))}</p>
            <div class="board-head" aria-hidden="true">${head}</div>
            ${lanes.map(laneBlock).join("") || `<p class="hint">${t("boardEmpty")}</p>`}
        </section>`;
}

/** The backlog's tasks the board shows: the open ones, and the done ones of its last days. */
function boardTasks()
{
    const since = dayIso(-data.boardDays);

    return (data.board ?? []).filter((task) => columnOf(task) !== "done" || (task.done ?? task.archived ?? "9999") >= since);
}

function boardLanes(tasks)
{
    const goalOf = (task) => (task.goal && task.goal !== data.words.noGoal ? task.goal : "");
    const sections = data.plan.sections.filter((section) => section.name !== data.words.noGoal);
    const names = [...new Set([...sections.map((section) => section.name), ...tasks.map(goalOf).filter(Boolean), ""])];

    return names.map((name) => {
        const own = tasks.filter((task) => goalOf(task) === name);
        const section = sections.find((one) => one.name === name);
        const done = section?.done ?? own.filter((task) => columnOf(task) === "done").length;
        const total = section?.total ?? own.length;
        return { name, title: name ? section?.title ?? name : t("noGoalLane"), own, done, total, closed: section?.closed ?? null };
    }).filter((lane) => lane.own.length > 0 && !lane.closed);
}

function laneBlock(lane)
{
    const percent = ratio(lane.done, lane.total);
    const working = lane.own.some((task) => task.state === "doing");
    const open = lanesOpen[lane.name] ?? lane.own.some((task) => columnOf(task) !== "done");
    const [, name, note] = /^(.*?)(?:\s*\((.*)\))?$/.exec(lane.title);
    const cells = boardStates.map((state) => laneCell(lane, state)).join("");

    return `<details class="lane" data-lane="${attribute(lane.name)}" ${open ? "open" : ""}>
            <summary>
                <span class="chevron" aria-hidden="true"></span>
                <span class="title"><b>${escape(name)}</b>${note ? ` <span>${escape(note)}</span>` : ""}</span>
                <div class="bar ${lane.done === lane.total && lane.total > 0 ? "done" : working ? "doing" : ""}" role="img" aria-label="${attribute(t("laneDone", lane.done, lane.total))}"><i data-width="${percent}%"></i></div>
                <span class="count" aria-hidden="true">${lane.done}/${lane.total}</span>
            </summary>
            <div class="lane-cells">${cells}</div>
        </details>`;
}

function laneCell(lane, state)
{
    const recent = (first, second) => (second.done ?? second.archived ?? "").localeCompare(first.done ?? first.archived ?? "") || second.id - first.id;
    const own = withPartsUnder(lane.own.filter((task) => columnOf(task) === state).sort(state === "done" ? recent : taskOrder));
    const here = new Set(own.map((task) => taskName(task)));
    const label = `${stateName(state)} · ${lane.name || t("noGoalLane")}`;

    return `<div class="cell" data-state="${state}" data-lane="${attribute(lane.name)}">
            <div class="cell-name column-name" aria-hidden="true"><i class="column-mark ${state}"></i>${escape(stateName(state))}<span class="badge">${own.length}</span></div>
            <ul class="cell-list" aria-label="${attribute(label)}">${own.map((task) => taskCard(task, lane.name, Boolean(task.parent && here.has(task.parent)))).join("")}</ul>
        </div>`;
}

/** A task on the board: its priority, number, effort and who holds it; its text, which opens; where it can move, once it has the focus. */
function taskCard(task, lane, isUnder = false)
{
    const name = taskName(task);
    const column = columnOf(task);
    const held = column === "doing" ? data.holds?.[String(task.id)] : null;
    const worker = held?.colleague ? data.colleagues.find((person) => person.id === held.colleague) : null;
    const foot = worker || held?.colleague
        ? `<span class="work" data-tip="${attribute(escape(t("atWork")))}">⚒︎ ${escape((worker?.name ?? held.colleague).split(" ")[0])}</span>`
        : column === "done" ? `<span>✓ ${escape(formatDay(task.done ?? task.archived))}${task.release ? ` · v${escape(task.release)}` : ""}</span>` : waitOrAge(task);
    const moves = boardStates.filter((state) => state !== column)
        .map((state) => `<button type="button" id="move-${name}-${state}" data-move="${state}" data-task="${task.id}" aria-label="${attribute(t("moveTo", name, stateName(state)))}">${escape(stateName(state))}</button>`).join("");

    return `<li class="task ${column} ${isUnder ? "part" : ""} ${expanded.has(`board-${name}`) ? "open" : ""} ${landed === task.id ? "landed" : ""}" draggable="true" data-task="${task.id}" data-lane="${attribute(lane)}" data-column="${column}">
            <div class="task-top">${typeIcon(task)}${priorityControl(task, "board")}<span class="id">${escape(name)}</span><span class="grow"></span>${effortMeter(task)}${face(task)}</div>
            ${expandButton(`board-${name}`, escape(task.text))}
            ${taskLinks(task, isUnder)}
            <div class="task-foot">${foot}${fieldSpans(task)}</div>
            <div class="moves" role="group" aria-label="${attribute(t("moveGroup", name))}"><span aria-hidden="true">${escape(t("moveLabel"))}</span>${moves}</div>
        </li>`;
}

/** The filters of the list of tasks: state and priority as buttons that stay pressed, who and goal as menus. */
function taskFilters()
{
    const all = data.board ?? [];
    const countOf = (keep) => all.filter(keep).length;
    const chip = (kind, value, label, count) => `<button type="button" id="filter-${kind}-${value}" data-task-filter="${kind}" data-value="${value}" aria-pressed="${taskFilter[kind] === value}">${label}${count === undefined ? "" : `<span class="count">${count}</span>`}</button>`;
    const states = [["open", t("filterOpenTasks"), (task) => columnOf(task) !== "done"], ...boardStates.map((state) => [state, escape(stateName(state)), (task) => columnOf(task) === state]), ["all", t("filterEvery"), () => true]];
    const types = [...new Set(all.map((task) => task.type).filter(Boolean))].sort();
    const priorities = [chip("priority", "all", t("filterAnyPriority")), ...["P1", "P2", "P3"].map((key) => chip("priority", key, `${priorityMark(key)}${escape(key)}`, countOf((task) => task.priority === key && columnOf(task) !== "done")))];
    const people = [...new Set(all.map((task) => task.to))].sort((first, second) => countOf((task) => task.to === second) - countOf((task) => task.to === first));
    const goals = [...new Set([...data.plan.sections.map((section) => section.name), ...all.map((task) => task.goal)])].filter((goal) => goal !== data.words.noGoal && all.some((task) => task.goal === goal));
    const option = (kind, value, label) => `<option value="${attribute(value)}" ${taskFilter[kind] === value ? "selected" : ""}>${escape(label)}</option>`;
    const noGoal = all.some((task) => task.goal === data.words.noGoal) ? option("goal", data.words.noGoal, t("noGoalLane")) : "";

    return `<div class="chips" role="group" aria-labelledby="filter-state-name"><span class="filter-name" id="filter-state-name">${t("filterState")}</span>${states.map(([value, label, keep]) => chip("state", value, label, countOf(keep))).join("")}</div>
        <div class="chips" role="group" aria-labelledby="filter-priority-name"><span class="filter-name" id="filter-priority-name">${t("filterPriority")}</span>${priorities.join("")}</div>
        ${types.length ? `<div class="chips" role="group" aria-labelledby="filter-type-name"><span class="filter-name" id="filter-type-name">${t("filterType")}</span>${chip("type", "all", t("anyType"))}${types.map((type) => chip("type", type, `${typeIcon({ type })}${escape(data.types?.[type] ?? type)}`, countOf((task) => task.type === type && columnOf(task) !== "done"))).join("")}</div>` : ""}
        <label>${t("filterWho")} <select id="filter-who" data-task-filter="who">${option("who", "all", t("anyone"))}${people.map((person) => option("who", person, person)).join("")}</select></label>
        <label>${t("filterGoal")} <select id="filter-goal" data-task-filter="goal">${option("goal", "all", t("anyGoal"))}${goals.map((goal) => option("goal", goal, goal)).join("")}${noGoal}</select></label>`;
}

/** Every task the filters keep, as the panel orders them: in progress, to do, postponed, each by priority and then the oldest; the done
 * last, the latest first. */
function filteredTasks()
{
    const keep = (task) => {
        const column = columnOf(task);
        const state = taskFilter.state === "all" || (taskFilter.state === "open" ? column !== "done" : column === taskFilter.state);
        return state && (taskFilter.type === "all" || task.type === taskFilter.type) && (taskFilter.priority === "all" || task.priority === taskFilter.priority) && (taskFilter.who === "all" || task.to === taskFilter.who) && (taskFilter.goal === "all" || task.goal === taskFilter.goal);
    };
    const closedLast = (first, second) => boardStates.indexOf(columnOf(first)) - boardStates.indexOf(columnOf(second));
    const recent = (first, second) => (columnOf(first) === "done" ? (second.done ?? second.archived ?? "").localeCompare(first.done ?? first.archived ?? "") : 0);

    return withPartsUnder((data.board ?? []).filter(keep).sort((first, second) => closedLast(first, second) || recent(first, second) || taskOrder(first, second)));
}

/** The tasks in their order with each part moved right under its large task, when that is among them: the parts in progress first. */
function withPartsUnder(tasks)
{
    const ids = new Set(tasks.map((task) => taskName(task)));
    const isUnder = (task) => Boolean(task.parent && ids.has(task.parent));
    const partsOf = (task) => (isUnfolded(task) ? tasks.filter((part) => part.parent === taskName(task)).sort((first, second) => Number(second.state === "doing") - Number(first.state === "doing")) : []);
    return tasks.filter((task) => !isUnder(task)).flatMap((task) => [task, ...partsOf(task)]);
}

function taskListBody()
{
    const tasks = filteredTasks();
    const ids = new Set(tasks.map((task) => taskName(task)));
    const rows = (editing === "new" ? taskForm(null) : "") + tasks.map((task) => (editing === task.id ? taskForm(task) : taskRow(task, Boolean(task.parent && ids.has(task.parent))))).join("");
    const filtered = Object.entries(taskFilter).some(([kind, value]) => value !== (kind === "state" ? "open" : "all"));

    return `<p class="found">${escape(t("listCount", tasks.length))}${filtered ? ` · <button type="button" id="filters-clear" data-clear-filters>${t("clearFilters")}</button>` : ""}</p>
        <ul class="rows">${rows || `<li class="row"><span></span><span></span><span class="hint">${t("listNone")}</span></li>`}</ul>`;
}

function taskRow(task, isUnder = false)
{
    const name = taskName(task);
    const column = columnOf(task);
    const held = column === "doing" ? data.holds?.[String(task.id)] : null;
    const worker = held?.colleague ? data.colleagues.find((person) => person.id === held.colleague) : null;
    const goal = task.goal && task.goal !== data.words.noGoal ? `<span>${escape(task.goal)}</span>` : "";
    const when = column === "done" ? `<span>✓ ${escape(formatDay(task.done ?? task.archived))}</span>` : waitOrAge(task);
    const work = worker || held?.colleague ? `<span class="work">⚒︎ ${escape((worker?.name ?? held.colleague).split(" ")[0])}</span>` : "";

    return `<li class="row ${column} ${isUnder ? "part" : ""}">
            ${face(task)}
            <span class="marks">${typeIcon(task)}${priorityControl(task, "list")}</span>
            <div>${expandButton(`list-${name}`, `<span class="id">${escape(name)}</span>${escape(task.text)}`)}
                <div class="row-meta"><span class="row-state"><i class="column-mark ${column}"></i>${escape(stateName(column))}</span>${work}${goal}${when}${task.release ? `<span>v${escape(task.release)}</span>` : ""}${fieldSpans(task)}${task.by ? `<span>${escape(t("createdBy", task.by))}</span>` : ""}<button type="button" class="link-button" id="edit-${name}" data-edit-task="${task.id}">${t("editTask")}</button></div>
                ${taskLinks(task, isUnder)}
            </div>
            ${effortMeter(task) || "<span></span>"}
        </li>`;
}

/** The project's own fields of a task, each as its name and value. */
function fieldSpans(task)
{
    return Object.entries(task.fields ?? {}).map(([key, value]) => `<span>${escape(data.fields?.[key]?.name ?? key)}: ${escape(value)}</span>`).join("");
}

/** A large task's parts shown: as the user left them, else while one is in progress. */
function isUnfolded(task)
{
    return folds[task.id] ?? (data.board ?? []).some((part) => part.parent === taskName(task) && part.state === "doing");
}

/** In place of a task's age: what a blocked task still waits for, «⛓ T-62», or a large task's parts closed, each said in words under
 * the pointer and to a screen reader; else its age. */
function waitOrAge(task)
{
    const blockers = task.blockedBy ?? [];
    const parts = task.parts ?? [];

    if (parts.length > 0) {
        const words = t("partsTip", task.partsDone, parts.length);
        const isOpen = isUnfolded(task);
        return `<button type="button" class="parts-chip ${task.state === "doing" ? "doing" : ""}" id="fold-${taskName(task)}" data-fold="${task.id}" aria-expanded="${isOpen}" data-tip="${attribute(escape(words))}"><span aria-hidden="true">${isOpen ? "▾" : "▸"} ${task.partsDone}/${parts.length}</span><span class="visually-hidden">${escape(words)}</span></button>`;
    }

    if (blockers.length > 0) {
        const words = t("blockedTip", blockers.join(", "));
        return `<span class="wait blocked" data-tip="${attribute(escape(words))}"><span aria-hidden="true">⛓ ${escape(blockers[0])}${blockers.length > 1 ? ` +${blockers.length - 1}` : ""}</span><span class="visually-hidden">${escape(words)}</span></span>`;
    }

    const due = task.dueInfo && (task.dueInfo.isLate || task.dueInfo.isNear) ? task.dueInfo : null;

    if (due) {
        const when = due.isLate ? t("dueLate", -due.days) : due.days === 0 ? t("dueToday") : t("dueIn", due.days);
        return `<span class="wait ${due.isLate ? "late" : "near"}" data-tip="${attribute(escape(t("dueTip", formatDay(due.day))))}"><span aria-hidden="true">⏰ </span>${escape(when)}</span>`;
    }

    if (task.stale && task.started) {
        const words = t("staleTip", formatDay(task.started));
        return `<span class="wait stale" data-tip="${attribute(escape(words))}"><span aria-hidden="true">⏸ ${escape(age(task.started))}</span><span class="visually-hidden">${escape(words)}</span></span>`;
    }

    return `<span data-tip="${attribute(escape(t("bornOn", formatDay(task.created))))}">${escape(age(task.created))}</span>`;
}

/** A task's type as Jira draws an issue type: a rounded square in its color with a white sign, its name under the pointer and to a
 * screen reader; nothing without one. */
function typeIcon(task)
{
    if (!task.type) {
        return "";
    }

    const signs = {
        bug: `<circle cx="7" cy="7" r="2.6" fill="#fff"/>`,
        feature: `<path d="M4.5 3.5h5v7L7 8.6 4.5 10.5z" fill="#fff"/>`,
        chore: `<path d="M4 7.2l2 2 4-4.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
        research: `<circle cx="6.3" cy="6.3" r="2.4" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M8.1 8.1l2.2 2.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`,
        test: `<path d="M5.4 3.2h3.2M6 3.2v2.9L3.7 10.2a.7.7 0 0 0 .6 1h5.4a.7.7 0 0 0 .6-1L8 6.1V3.2" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`,
    };
    const name = data.types?.[task.type] ?? task.type;
    const sign = signs[task.type] ?? `<text x="7" y="10" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">${escape(task.type.slice(0, 1).toUpperCase())}</text>`;
    return `<svg class="type-icon" width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="${attribute(name)}" data-tip="${attribute(escape(name))}"><rect x="0.5" y="0.5" width="13" height="13" rx="3" fill="${typeColors[task.type] ?? "#8993A4"}"/>${sign}</svg>`;
}

/** A task's links in words, both ways, under its text: the large task it is a part of, what it waits for, what waits for it, what it
 * points to and what points to it; its note, which opens. Nothing when it has none. */
function taskLinks(task, isUnder = false)
{
    const line = (label, list) => (list?.length ? `<span><b>${escape(label)}</b> ${escape(list.join(", "))}</span>` : "");
    const parts = [
        task.due ? `<span><b>${escape(t("linkDue"))}</b> ${escape(formatDay(task.due))}</span>` : "",
        task.started && task.state === "doing" ? `<span><b>${escape(t("linkStarted"))}</b> ${escape(formatDay(task.started))}</span>` : "",
        line(t("linkDecisions"), task.decisions),
        // A part drawn under its large task does not name it again.
        line(t("linkPartOf"), task.parent && !isUnder ? [task.parent] : []),
        line(t("linkParts"), task.parts),
        line(t("linkWaitsFor"), task.after),
        line(t("linkWaitedBy"), task.waitedBy),
        line(t("linkSee"), task.see),
        line(t("linkSeenFrom"), task.seenFrom),
        task.noteHref ? `<a href="${attribute(task.noteHref)}" target="_blank" rel="noopener">${escape(t("openNote"))}</a>` : "",
        ...codeLinks(task),
    ].filter(Boolean);
    return parts.length > 0 ? `<div class="task-links">${parts.join("")}</div>` : "";
}

/** The code that cites a task: how many commits, the latest a link and the others under the pointer; each pull request, a link, with
 * its state; on a task still open, a merged one says it can close. */
function codeLinks(task)
{
    const commits = task.commits ?? [];
    const link = (href, text, tip = "") => (href ? `<a href="${attribute(href)}" target="_blank" rel="noopener" ${tip ? `data-tip="${attribute(tip)}"` : ""}>${escape(text)}</a>` : `<span ${tip ? `data-tip="${attribute(tip)}"` : ""}>${escape(text)}</span>`);
    const list = commits.map((commit) => `${escape(commit.hash)} ${escape(commit.day)} ${escape(commit.subject.slice(0, 90))}`).join("<br>");
    const state = (pull) => (pull.merged ? t("pullMerged", formatDay(pull.merged)) : t(pull.state === "open" ? "pullOpen" : "pullClosed"));
    const open = columnOf(task) !== "done";
    const issue = task.issueInfo;
    return [
        issue ? link(issue.url, `${t("linkIssue")} #${issue.number} · ${t(issue.state === "open" ? "pullOpen" : "pullClosed")}`, escape(issue.title)) : "",
        commits.length ? link(commits[0].url, t("commitsCount", task.commitCount, formatDay(commits[0].day)), list) : "",
        ...(task.pulls ?? []).map((pull) => link(pull.url, `#${pull.number} · ${state(pull)}`, escape(pull.title))),
        open && task.mergedPull ? `<span class="work">${escape(t("mergedCanClose", task.mergedPull.number))}</span>` : "",
    ];
}

/** The open GitHub issues no task does yet, each a link with the button that makes it a task of the backlog; nothing without them. */
function issuesCard()
{
    const issues = data.issues ?? [];

    if (!issues.length) {
        return "";
    }

    const rows = issues.map((issue) => `<li class="issue-row">${issue.url ? `<a href="${attribute(issue.url)}" target="_blank" rel="noopener"><b>#${issue.number}</b> ${escape(issue.title)}</a>` : `<span><b>#${issue.number}</b> ${escape(issue.title)}</span>`}<button type="button" id="issue-take-${issue.number}" data-take-issue="${issue.number}" data-title="${attribute(issue.title)}">${escape(t("issueToBacklog"))}</button></li>`).join("");
    return `<section class="card span-12">
            <h2>${escape(t("issuesTitle"))} <span class="badge">${issues.length}</span></h2>
            <p class="hint">${escape(t("issuesHint"))}</p>
            <ul class="issues">${rows}</ul>
        </section>`;
}

/** A task written in the list, new or one there: its text, goal, priority, type, who holds it and when it is due; save, cancel and,
 * for one there, archive. */
function taskForm(task)
{
    const id = task ? task.id : "new";
    const option = (value, label, chosen) => `<option value="${attribute(value)}" ${value === chosen ? "selected" : ""}>${escape(label)}</option>`;
    const goals = [...new Set([data.words.noGoal, ...(data.plan.openGoals ?? []), ...(task ? [task.goal] : [])])];
    const people = [...new Set([...(data.people ?? []), ...data.colleagues.map((person) => person.short ?? person.name), ...(task ? [task.to] : [])])];
    const types = ["", ...Object.keys(data.types ?? {})];
    // A large task takes parts one level deep: the open tasks that are no part themselves, nor this task.
    const parents = ["", ...(data.board ?? []).filter((one) => !one.parent && columnOf(one) !== "done" && one.id !== task?.id && !(task?.parts ?? []).length).map((one) => taskName(one))];
    const parentLabel = (name) => {
        const one = (data.board ?? []).find((each) => taskName(each) === name);
        return one ? `${name} · ${one.text.length > 50 ? `${one.text.slice(0, 50)}…` : one.text}` : name;
    };
    const field = (key, label, control) => `<label class="form-field"><span>${escape(label)}</span>${control}</label>`;

    return `<li class="row task-form" data-form="${id}">
            <span></span><span></span>
            <div>
                <textarea id="form-text-${id}" rows="2" placeholder="${attribute(t("taskTextHint"))}">${escape(task?.text ?? "")}</textarea>
                <div class="form-fields">
                    ${field("goal", t("filterGoal"), `<select id="form-goal-${id}">${goals.map((goal) => option(goal, goal === data.words.noGoal ? t("noGoalLane") : goal, task?.goal ?? data.words.noGoal)).join("")}</select>`)}
                    ${field("priority", t("filterPriority"), `<select id="form-priority-${id}">${["P1", "P2", "P3"].map((key) => option(key, priorityName(key), task?.priority ?? "P2")).join("")}</select>`)}
                    ${field("type", t("filterType"), `<select id="form-type-${id}">${types.map((key) => option(key, key ? data.types[key] : "—", task?.type ?? "")).join("")}</select>`)}
                    ${field("to", t("filterWho"), `<select id="form-to-${id}">${people.map((person) => option(person, person, task?.to ?? people[0])).join("")}</select>`)}
                    ${field("due", t("linkDue"), `<input type="date" id="form-due-${id}" value="${attribute(task?.due ?? "")}">`)}
                    ${Object.entries(data.fields ?? {}).map(([key, own]) => field(key, own.name, own.values
                        ? `<select id="form-field-${key}-${id}">${["", ...own.values].map((value) => option(value, value || "—", task?.fields?.[key] ?? "")).join("")}</select>`
                        : `<input type="text" id="form-field-${key}-${id}" value="${attribute(task?.fields?.[key] ?? "")}">`)).join("")}
                    ${(task?.parts ?? []).length ? "" : field("parent", t("linkPartOf"), `<select id="form-parent-${id}">${[...new Set([...parents, ...(task?.parent ? [task.parent] : [])])].map((name) => option(name, name ? parentLabel(name) : "—", task?.parent ?? "")).join("")}</select>`)}
                </div>
                <div class="actions">
                    <button type="button" class="action primary" data-save-task="${id}">${t("saveTask")}</button>
                    <button type="button" class="action" data-cancel-task>${t("cancelEdit")}</button>
                    ${task ? `<button type="button" class="action" data-archive-task="${task.id}">${t("archiveTask")}</button>` : ""}
                </div>
            </div>
            <span></span>
        </li>`;
}

/** Saves a task written in the list: a new one added, one there changed in what changed. */
async function saveTask(id)
{
    const value = (field) => document.getElementById(`form-${field}-${id}`)?.value ?? "";
    const text = value("text").trim();

    if (!text) {
        alert(t("taskTextHint"));
        return;
    }

    const task = id === "new" ? null : data.board.find((one) => String(one.id) === String(id));
    const fields = { text, goal: value("goal"), priority: value("priority"), type: value("type"), to: value("to"), due: value("due"), parent: value("parent") };
    // The project's own fields, by key: those that changed for a task there, those given for a new one; "" clears one.
    const own = Object.keys(data.fields ?? {}).map((key) => [key, value(`field-${key}`).trim()]);
    fields.fields = Object.fromEntries(own.filter(([key, given]) => given !== (task?.fields?.[key] ?? "")));

    // A part without a goal of its own takes its large task's.
    if (fields.parent && fields.goal === data.words.noGoal) {
        fields.goal = data.board.find((one) => taskName(one) === fields.parent)?.goal ?? fields.goal;
    }

    const changed = task ? Object.fromEntries(Object.entries(fields).filter(([key, current]) => (key === "fields" ? Object.keys(current).length > 0 : current !== String((key === "priority" ? task.priority : task[key]) ?? "")))) : fields;
    editing = null;

    if (task && Object.keys(changed).length === 0) {
        lastData = "";
        await load();
        return;
    }

    await changeTask(task ? { command: "set", id: taskName(task), ...changed } : { command: "add", ...fields }, task ? t("taskSaved", taskName(task)) : t("taskAdded"));
}

/** Puts the board's hands on the page once: drags, the moves, the priorities, the texts that open, the filters and the search. */
function setupBoard()
{
    const app = document.getElementById("app");

    app.addEventListener("click", (event) => {
        const target = event.target.closest?.("button");

        if (!target) {
            return;
        }

        if (target.dataset.move) {
            moveTask(target.dataset.task, target.dataset.move, true);
        } else if (target.dataset.priority) {
            turnPriority(target.dataset.priority, target.dataset.next, target.id);
        } else if (target.dataset.expand) {
            toggleText(target);
        } else if (target.dataset.taskFilter) {
            taskFilter[target.dataset.taskFilter] = target.dataset.value;
            refreshTaskList(target.id);
        } else if (target.hasAttribute("data-clear-filters")) {
            Object.assign(taskFilter, { state: "open", priority: "all", type: "all", who: "all", goal: "all" });
            refreshTaskList("filter-state-open");
        } else if (target.dataset.fold) {
            const task = data.board.find((one) => String(one.id) === target.dataset.fold);
            folds[task.id] = !isUnfolded(task);
            // The focus stays on the chip pressed, in its own tab: the board and the list each draw one.
            const panel = target.closest("[id^='panel-']")?.id;
            render();
            document.querySelector(`#${panel} [data-fold="${task.id}"]`)?.focus();
        } else if (target.hasAttribute("data-new-task")) {
            editing = "new";
            document.getElementById("task-list").innerHTML = taskListBody();
            document.getElementById("form-text-new")?.focus();
        } else if (target.dataset.editTask) {
            editing = Number(target.dataset.editTask);
            document.getElementById("task-list").innerHTML = taskListBody();
            document.getElementById(`form-text-${editing}`)?.focus();
        } else if (target.dataset.saveTask) {
            saveTask(target.dataset.saveTask);
        } else if (target.hasAttribute("data-cancel-task")) {
            editing = null;
            document.getElementById("task-list").innerHTML = taskListBody();
            lastData = "";
            load();
        } else if (target.dataset.archiveTask) {
            const name = taskName({ id: target.dataset.archiveTask });

            if (confirm(t("archiveConfirm", name))) {
                editing = null;
                changeTask({ command: "archive", id: name }, t("taskArchived", name));
            }
        } else if (target.hasAttribute("data-tidy-backlog")) {
            // The backlog's tidying runs from the cleanup, in the Health tab, where its proposals show.
            selectTab(document.getElementById("tab-health"));
            tidyAction("backlog", { cost: null });
        } else if (target.dataset.takeIssue) {
            changeTask({ command: "issue", issue: target.dataset.takeIssue, title: target.dataset.title }, t("issueTaken", target.dataset.takeIssue));
        } else if (target.dataset.goLane !== undefined) {
            goToLane(target.dataset.goLane);
        } else if (target.dataset.goTasks !== undefined) {
            goToTasks(target.dataset.goTasks);
        } else if (target.dataset.document) {
            openDocument(Number(target.dataset.document), target);
        } else if (target.id === "decisions-more") {
            const first = matchingDecisions()[decisionLimit];
            decisionLimit += 100;
            document.getElementById("decision-list").innerHTML = decisionListBody();
            document.getElementById(first ? `decision-${first.number}` : "decision-search")?.focus();
        }
    });
    app.addEventListener("change", (event) => {
        if (event.target.matches?.("select[data-task-filter]")) {
            taskFilter[event.target.dataset.taskFilter] = event.target.value;
            refreshTaskList(event.target.id);
        }
    });
    app.addEventListener("input", (event) => {
        if (event.target.id === "decision-search") {
            decisionQuery = event.target.value;
            decisionLimit = decisionsShown;
            document.getElementById("decision-list").innerHTML = decisionListBody();
            const found = foundLine(matchingDecisions().length);
            document.getElementById("decision-found").textContent = found;
            announce(found, 600);
        }
    });
    // A goal's lane, opened or closed by hand, stays so; toggle does not bubble, so it is caught on its way down.
    app.addEventListener("toggle", (event) => {
        if (event.target.matches?.("details.lane")) {
            lanesOpen[event.target.dataset.lane] = event.target.open;
            saveLanes();
        }
    }, true);
    app.addEventListener("dragstart", (event) => {
        const card = event.target.closest?.(".task[draggable]");

        if (!card) {
            return;
        }

        dragging = { card, id: card.dataset.task, lane: card.dataset.lane, from: card.dataset.column };
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", taskName({ id: card.dataset.task }));
        requestAnimationFrame(() => card.classList.add("dragging"));
        document.querySelectorAll(".cell").forEach((cell) => cell.classList.toggle("can-drop", cell.dataset.lane === dragging.lane && cell.dataset.state !== dragging.from));
    });
    app.addEventListener("dragover", (event) => {
        const cell = dragging && event.target.closest?.(".cell.can-drop");

        if (cell) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
        }

        document.querySelectorAll(".cell.target").forEach((other) => other !== cell && other.classList.remove("target"));
        cell?.classList.add("target");
    });
    app.addEventListener("drop", (event) => {
        const cell = dragging && event.target.closest?.(".cell.can-drop");

        if (!cell) {
            return;
        }

        event.preventDefault();
        dragging.card.classList.add("pending");
        cell.querySelector(".cell-list").prepend(dragging.card);
        dragging.dropped = cell.dataset.state;
    });
    app.addEventListener("dragend", () => {
        const { card, id, dropped } = dragging ?? {};
        card?.classList.remove("dragging");
        document.querySelectorAll(".cell.can-drop, .cell.target").forEach((cell) => cell.classList.remove("can-drop", "target"));
        dragging = null;

        if (dropped) {
            moveTask(id, dropped, false);
        } else if (renderWaits) {
            renderWaits = false;
            render();
        }
    });
}

/** Moves a task to a column through the backlog's command; from the keys, the focus follows the card to its new column. */
function moveTask(id, state, byKeys)
{
    const task = data.board.find((one) => String(one.id) === String(id));

    if (!task || columnOf(task) === state) {
        return;
    }

    const name = taskName(task);
    focusAfter = byKeys ? { id: `board-${name}`, scroll: true } : null;
    landed = task.id;
    changeTask({ command: moveCommands[state], id: name }, t("moved", name, stateName(state)));
}

function turnPriority(id, next, buttonId)
{
    const name = taskName({ id });
    focusAfter = { id: buttonId };
    changeTask({ command: "set", id: name, priority: next }, t("priorityNow", name, priorityName(next)));
}

/** Asks the page's server to change the backlog; a refusal is shown with its message. The page reads the project again after. */
async function changeTask(payload, done)
{
    let answer;

    try {
        const response = await fetch("/backlog", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        answer = await response.json().catch(() => ({ ok: false, message: `${response.status} ${response.statusText}` }));
    } catch (error) {
        answer = { ok: false, message: String(error?.message ?? error) };
    }

    if (answer.ok) {
        announce(done);
    } else {
        focusAfter = null;
        landed = null;
        alert(t("failed", answer.message));
    }

    renderWaits = false;
    lastData = "";
    await load();
}

function toggleText(button)
{
    const id = button.dataset.expand;
    const open = !expanded.has(id);
    open ? expanded.add(id) : expanded.delete(id);
    button.setAttribute("aria-expanded", open);
    button.closest(".task")?.classList.toggle("open", open);

    // A decision's reasons show only while it is open.
    if (id.startsWith("decision-")) {
        document.getElementById("decision-list").innerHTML = decisionListBody();
        document.getElementById(id)?.focus();
    }
}

function refreshTaskList(focusId)
{
    document.getElementById("task-filters").innerHTML = taskFilters();
    document.getElementById("task-list").innerHTML = taskListBody();
    document.getElementById(focusId)?.focus();
    announce(t("listCount", filteredTasks().length));
}

/** A priority as Crew draws it: a button that turns it, P1, P2, P3 and P1 again; only a mark on a task already done. */
function priorityControl(task, where)
{
    const key = task.priority;
    const name = priorityName(key);

    if (columnOf(task) === "done" || !priorityMarks[key]) {
        return `<span class="prio" role="img" aria-label="${attribute(name)}" data-tip="${attribute(escape(name))}">${priorityMark(key)}</span>`;
    }

    const next = nextPriority[key];
    const id = `${where}-priority-${taskName(task)}`;

    return `<button type="button" class="prio" id="${id}" data-priority="${task.id}" data-next="${next}" aria-label="${attribute(t("priorityTurn", taskName(task), name, priorityName(next)))}" data-tip="${attribute(`<b>${escape(name)}</b>${escape(t("priorityClick", priorityName(next)))}`)}">${priorityMark(key)}</button>`;
}

/** A priority's arrows, a drawing only: whatever holds it says the priority in words. */
function priorityMark(key)
{
    const mark = priorityMarks[key];

    return mark ? `<svg class="icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${mark}</svg>` : "";
}

/** «P1, high priority», in the project's words. */
function priorityName(key)
{
    return key ? `${key}, ${t("priorityName", data.words.priorities[key] ?? key)}` : t("noPriority");
}

/** The effort a task needs as four bars, low to max; nothing for none. */
function effortMeter(task)
{
    const filled = effortBars[task.effortKey];

    if (!filled) {
        return "";
    }

    const bars = [0, 1, 2, 3].map((index) => `<rect x="${index * 4}" y="1" width="3" height="10" rx="1" fill="currentColor" fill-opacity="${index < filled ? 1 : 0.3}"/>`).join("");
    const label = t("effortName", task.effort);

    return `<span class="effort" role="img" aria-label="${attribute(label)}" data-tip="${attribute(escape(label))}"><svg class="icon" width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">${bars}</svg></span>`;
}

/** Who holds a task: Claude's critter, a colleague's portrait or initials on their color, a person's initials in gray. */
function face(task)
{
    const person = task.colleague ? data.colleagues.find((one) => one.id === task.colleague) : null;
    const name = person?.name ?? task.to;
    const tip = `data-tip="${attribute(`<b>${escape(name)}</b>${person ? escape(person.role) : ""}`)}"`;

    if (task.to === "Claude") {
        return `<span class="face" role="img" aria-label="Claude" ${tip}>${critter}</span>`;
    }

    if (person?.hasPortrait) {
        return `<img class="face" src="/portrait/${attribute(person.id)}" alt="${attribute(name)}" ${tip}>`;
    }

    // The owner's GitHub picture, on their tasks and on every decision.
    if (data.owner?.href && task.to === data.owner.name) {
        return `<img class="face" src="${attribute(data.owner.href)}" alt="${attribute(data.owner.fullName)}" data-tip="${attribute(`<b>${escape(data.owner.fullName)}</b>`)}">`;
    }

    const initials = String(name).split(/\s+/).map((part) => part[0] ?? "").join("").slice(0, 2).toUpperCase();
    const color = person ? tints[person.color] ?? "#6b6b67" : "#8a8a86";

    return `<span class="face" role="img" aria-label="${attribute(name)}" style="background:${color}" ${tip}>${escape(initials)}</span>`;
}

/** Claude: an orange pixel critter on a round cream background, as Crew draws it. */
function claudeCritter()
{
    const rows = [".X........X.", "..X......X..", "..XXXXXXXX..", ".XXXXXXXXXX.", ".XXEEXXEEXX.", "XXXEEXXEEXXX", "XXXXXXXXXXXX", ".XXXXXXXXXX.", "..X.X..X.X..", "..X.X..X.X.."];
    const runs = rows.flatMap((row, y) => [...row.matchAll(/X+|E+/g)].map((run) => `<rect x="${run.index + 2}" y="${y + 3}" width="${run[0].length}" height="1" fill="${run[0][0] === "E" ? "#2B1D17" : "#D97757"}"/>`));

    return `<svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#F3E6DC"/><g shape-rendering="crispEdges">${runs.join("")}</g></svg>`;
}

/** The column a task sits in: an archived task is a done one. */
function columnOf(task)
{
    return task.state === "archived" ? "done" : task.state;
}

function stateName(state)
{
    return data.words.states[state] ?? state;
}

function taskName(task)
{
    return `${data.prefixes.task}-${task.id}`;
}

/** The panel's order: by priority, then the oldest, then by number. */
function taskOrder(first, second)
{
    const [one, other] = [mostUrgent(first), mostUrgent(second)];
    return (priorityRank[one.priority] ?? 4) - (priorityRank[other.priority] ?? 4) || (one.created ?? "").localeCompare(other.created ?? "") || first.id - second.id;
}

/** A task, or for a large task the most urgent of it and its open parts: a large task stands where that part would. */
function mostUrgent(task)
{
    const parts = (data.board ?? []).filter((part) => part.parent === taskName(task) && columnOf(part) !== "done");
    return [task, ...parts].sort((first, second) => (priorityRank[first.priority] ?? 4) - (priorityRank[second.priority] ?? 4) || (first.created ?? "").localeCompare(second.created ?? ""))[0];
}

/** How old a day is, «3 d», as the panel says it. */
function age(day)
{
    return day ? t("ageDays", Math.max(0, Math.round((Date.parse(dayIso(0)) - Date.parse(day)) / 86400000))) : "";
}

/** Today, or so many days from it, as YYYY-MM-DD in the local calendar. */
function dayIso(offset)
{
    const day = new Date();
    day.setDate(day.getDate() + offset);

    return `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
}

function searchTerms(query)
{
    return folded(query).split(/\s+/).filter(Boolean);
}

/** A text for searching: lower case, without accents. */
function folded(text)
{
    return String(text).normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
}

/** A text, escaped, with the search's words marked where they appear, accents and case aside. */
function marked(text, terms)
{
    if (terms.length === 0) {
        return escape(text);
    }

    // Folding keeps one character a letter, so a place in the folded text is the same place in the text.
    const letters = [...String(text)];
    const plain = letters.map((letter) => folded(letter));
    const hits = new Array(letters.length).fill(false);

    for (const term of terms) {
        const whole = plain.join("");
        let from = whole.indexOf(term);

        while (from >= 0) {
            let at = 0;

            for (let index = 0; index < letters.length; index++) {
                if (at >= from && at < from + term.length) {
                    hits[index] = true;
                }

                at += plain[index].length;
            }

            from = whole.indexOf(term, from + term.length);
        }
    }

    return letters.map((letter, index) => {
        const open = hits[index] && !hits[index - 1] ? "<mark>" : "";
        const close = hits[index] && !hits[index + 1] ? "</mark>" : "";
        return `${open}${escape(letter)}${close}`;
    }).join("");
}

/** The element that has the focus, by its id, with the caret of a field; null when nothing of the page's has it. */
function focusedElement()
{
    const element = document.activeElement;

    if (!element?.id || !element.closest?.("#app, #tabs")) {
        return null;
    }

    return { id: element.id, start: element.selectionStart ?? null, end: element.selectionEnd ?? null };
}

function restoreFocus(focus)
{
    const element = focus && document.getElementById(focus.id);

    if (!element) {
        return;
    }

    element.focus({ preventScroll: !focus.scroll });

    if (focus.start !== null && focus.start !== undefined && element.setSelectionRange) {
        element.setSelectionRange(focus.start, focus.end);
    }

    if (focus.scroll) {
        element.scrollIntoView({ block: "nearest" });
    }
}

/** Says a change to a screen reader; with a delay, only the last of a quick run is said. */
function announce(text, delay = 0)
{

}

/** A key document: its page in small, an icon for its kind, its name, its first line, when it changed and how long it is. The card opens it. */
function keyDocumentCard(document, index)
{
    const known = data.documents.find((one) => documentPath(one) === document.path);
    const text = documentTexts.get(`${document.href}@${documentStamp(document)}`);
    const facts = known ? [formatDay(known.modified.slice(0, 10)), t("docWords", known.words.toLocaleString(t("locale")))] : [];
    const icon = documentIcon(document.name, document.path);

    if (!document.exists) {
        return `<article class="doc-card missing">
                <div class="doc-paper empty" aria-hidden="true"></div>
                <div class="doc-info">${icon}<div><h3>${escape(document.name)}</h3><p class="doc-sub">${t("docMissing")}</p></div></div>
                <p class="doc-meta"><code title="${attribute(document.path)}">${escape(document.path)}</code></p>
            </article>`;
    }

    return `<article class="doc-card">
            <div class="doc-paper ${text === undefined ? "empty" : ""}" aria-hidden="true">${text === undefined ? "" : markdown(text.split(/\r?\n/).slice(0, 48).join("\n"))}</div>
            <div class="doc-info">${icon}<div>
                <h3><button type="button" class="doc-open" id="open-document-${index}" data-document="${index}" aria-describedby="document-sub-${index}">${escape(document.name)}</button></h3>
                <p class="doc-sub" id="document-sub-${index}">${escape(text === undefined ? document.path : documentSubtitle(text, document.name))}</p>
            </div></div>
            <p class="doc-meta" data-tip="${attribute(escape(document.path))}">${facts.map(escape).join(" · ")}</p>

}

/** Another document of the docs: its icon, its name, how long it is and when it changed. */
function documentMini(document)
{

    const name = document.name.replace(/\.md$/i, "");
    const facts = [t("docWords", document.words.toLocaleString(locale)), relative(document.modified)];

    return `<div class="doc-mini" data-tip="${attribute(`<b>${escape(`${data.docs}/${document.name}`)}</b>${escape(t("docLines", document.lines.toLocaleString(locale)))}`)}">${documentIcon(name, document.name, true)}<div><b>${escape(name)}</b><span>${escape(facts.join(" · "))}</span></div></div>`;
}

/** Reads the texts of the documents the gallery shows that the page has not read yet, then draws the page once. */
async function readDocuments(list)
{
    const missing = list.filter(({ href, stamp }) => !documentTexts.has(`${href}@${stamp}`) && !documentsReading.has(href));

    if (missing.length === 0) {
        return;
    }

    let read = 0;
    missing.forEach(({ href }) => documentsReading.add(href));
    await Promise.all(missing.map(async ({ href, stamp }) => {
        try {
            const response = await fetch(href);
            documentTexts.set(`${href}@${stamp}`, response.ok ? withoutFrontmatter(await response.text()) : "");
            read++;
        } catch {
            // the server is restarting: the next reading of the data tries again
        }

        documentsReading.delete(href);
    }));

    if (read > 0) {
        rerender();
    }
}

/** A document's path as the configuration writes it, from the docs' folder. */
function documentPath(document)
{
    return `${data.docs.replace(/\/$/, "")}/${document.name}`;
}

/** When a key document last changed, as far as the page knows: its text is read again after. */
function documentStamp(document)
{
    return data.documents.find((one) => documentPath(one) === document.path)?.modified ?? "";
}

/** A document's first line under its name: its heading, unless it only says the name again, else its first sentence. */
function documentSubtitle(text, name)
{
    const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    const plain = (line) => line.replace(/^#+\s*/, "").replace(/^>\s*(\[!\w+\]\s*)?/, "").replace(/\*\*|__|`/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").trim();
    const heading = lines.find((line) => /^#\s/.test(line));
    const title = heading ? plain(heading) : "";
    const repeats = !title || folded(title).includes(folded(name)) || folded(name).includes(folded(title));
    const first = lines.find((line) => !/^(#|\||```|[-*_]{3,}$)/.test(line));

    return repeats ? plain(first ?? "") : title;
}

/** An icon for the kind of a document, read from its name: the design, a specification, the architecture, rules, a glossary, tests, a
 * plan, decisions, tasks, ideas, wishes, an index; a page for any other. */
function documentIcon(name, path, small = false)
{
    const text = folded(`${name} ${path.split("/").at(-1)}`);
    const kind = documentKinds.find(([, pattern]) => pattern.test(text))?.[0] ?? "page";
    const [color, drawing] = documentDrawings[kind];

    return `<span class="doc-icon ${small ? "small" : ""}" style="--kind:${color}" aria-hidden="true"><svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${drawing}</svg></span>`;
}

/** The key document the address asks for, #documents/2 (the panel's links), opened in the reader once; the address keeps the tab. */
function openAskedDocument()
{
    const asked = /^#documents\/(\d+)$/.exec(location.hash);

    if (asked && data?.keyDocuments?.[Number(asked[1])]) {
        history.replaceState(null, "", "#documents");
        openDocument(Number(asked[1]));
    }
}

/** Opens a key document in the page's reader, its markdown made readable; the plain text stays a link away. */
async function openDocument(index, opener)
{
    const document = data.keyDocuments?.[index];
    const reader = window.document.getElementById("reader");

    if (!document) {
        return;
    }

    reader.querySelector("h2").textContent = document.name;
    reader.querySelector(".reader-path").textContent = document.path;
    reader.querySelector(".reader-plain").href = document.href;
    reader.querySelector(".reader-plain").textContent = t("docPlain");
    reader.querySelector(".reader-close").textContent = t("docClose");
    const body = reader.querySelector(".reader-body");
    body.innerHTML = `<p class="hint">${t("docLoading")}</p>`;
    reader.returnFocus = opener;

    if (!reader.open) {
        reader.showModal();
    }

    try {
        const response = await fetch(document.href);

        if (!response.ok) {
            throw new Error(`${response.status} ${await response.text()}`);
        }

        body.innerHTML = markdown(await response.text());
        body.scrollTop = 0;
    } catch (error) {
        body.innerHTML = `<p class="hint">${escape(t("failed", error.message))}</p>`;
    }
}

function setupReader()
{
    const reader = document.getElementById("reader");
    reader.querySelector(".reader-close").addEventListener("click", () => reader.close());
    reader.addEventListener("close", () => reader.returnFocus?.focus());
    // A click on the backdrop, outside the reader's box, closes it.
    reader.addEventListener("click", (event) => {
        if (event.target === reader) {
            reader.close();
        }
    });
    // A link to another key document opens it here; any other link to a page of the docs has nowhere to go.
    reader.addEventListener("click", (event) => {
        const link = event.target.closest?.("a[data-document]");

        if (link) {
            event.preventDefault();
            openDocument(Number(link.dataset.document), reader.returnFocus);
        }
    });
}

/** Markdown made readable, enough for the project's docs: headings, paragraphs, lists, quotes and callouts, tables, code, links. */
/** A document's text without its frontmatter, the `---` block at its top: the file's, not the reader's. */
function withoutFrontmatter(text)
{
    return String(text ?? "").replace(/^---\r?\n[\s\S]*?\r?\n---[ \t]*(?:\r?\n|$)/, "").replace(/^(\r?\n)+/, "");
}

function markdown(text)
{
    const lines = withoutFrontmatter(text).replace(/\r/g, "").split("\n");
    const html = [];
    let index = 0;

    while (index < lines.length) {
        const line = lines[index];

        if (/^```/.test(line)) {
            const code = [];

            for (index++; index < lines.length && !/^```/.test(lines[index]); index++) {
                code.push(lines[index]);
            }

            html.push(`<pre><code>${escape(code.join("\n"))}</code></pre>`);
            index++;
        } else if (/^#{1,6}\s/.test(line)) {
            const level = Math.min(6, line.match(/^#+/)[0].length + 1);
            html.push(`<h${level}>${inline(line.replace(/^#+\s*/, ""))}</h${level}>`);
            index++;
        } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
            html.push("<hr>");
            index++;
        } else if (/^>/.test(line)) {
            const quote = [];

            for (; index < lines.length && /^>/.test(lines[index]); index++) {
                quote.push(lines[index].replace(/^>\s?/, ""));
            }

            const callout = /^\[!(\w+)\]\s*(.*)$/.exec(quote[0] ?? "");
            const inner = callout ? [callout[2] ? `**${callout[2]}**` : "", ...quote.slice(1)] : quote;
            html.push(`<blockquote${callout ? ` class="callout"` : ""}>${markdown(inner.join("\n"))}</blockquote>`);
        } else if (/^\|.*\|\s*$/.test(line) && /^\|[\s:|-]+\|\s*$/.test(lines[index + 1] ?? "")) {
            const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => inline(cell.trim()));
            const head = cells(line);
            const rows = [];

            for (index += 2; index < lines.length && /^\|/.test(lines[index]); index++) {
                rows.push(cells(lines[index]));
            }

            html.push(`<div class="reader-table"><table><thead><tr>${head.map((cell) => `<th>${cell}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        } else if (/^\s*([-*+]|\d+[.)])\s/.test(line)) {
            html.push(list(lines, index));
            index = list.end;
        } else if (line.trim() === "") {
            index++;
        } else {
            const paragraph = [];

            for (; index < lines.length && lines[index].trim() !== "" && !/^(#{1,6}\s|>|```|\|)/.test(lines[index]) && !/^\s*([-*+]|\d+[.)])\s/.test(lines[index]); index++) {
                paragraph.push(lines[index]);
            }

            html.push(`<p>${inline(paragraph.join(" "))}</p>`);
        }
    }

    return html.join("\n");
}

/** A list from a line on, with the lists nested under it by their indent; list.end is the first line after it. */
function list(lines, start)
{
    const indentOf = (line) => line.match(/^\s*/)[0].length;
    const indent = indentOf(lines[start]);
    const ordered = /^\s*\d+[.)]\s/.test(lines[start]);
    const items = [];
    let index = start;

    while (index < lines.length) {
        const line = lines[index];

        if (/^\s*([-*+]|\d+[.)])\s/.test(line) && indentOf(line) === indent) {
            items.push({ text: line.replace(/^\s*([-*+]|\d+[.)])\s+/, ""), nested: "" });
            index++;
        } else if (/^\s*([-*+]|\d+[.)])\s/.test(line) && indentOf(line) > indent && items.length) {
            items.at(-1).nested += list(lines, index);
            index = list.end;
        } else if (line.trim() !== "" && indentOf(line) > indent && items.length) {
            items.at(-1).text += ` ${line.trim()}`;
            index++;
        } else {
            break;
        }
    }

    list.end = index;
    const tag = ordered ? "ol" : "ul";

    return `<${tag}>${items.map((item) => `<li>${inline(item.text.replace(/^\[([ xX])\]\s/, (_, mark) => (mark === " " ? "☐ " : "☑ ")))}${item.nested}</li>`).join("")}</${tag}>`;
}

/** A line's inline markdown: code, bold, italics, links; a link to another key document opens it in the reader. */
function inline(text)
{
    const codes = [];
    let html = escape(text).replace(/`([^`]+)`/g, (_, code) => {
        codes.push(`<code>${code}</code>`);
        return `\u0000${codes.length - 1}\u0000`;
    });
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/(^|[^\w])_(?!\s)(.+?)_(?!\w)/g, "$1<em>$2</em>");
    html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, target) => {
        const file = target.split("#")[0].split("/").at(-1);
        const key = (data.keyDocuments ?? []).findIndex((document) => document.exists && file && document.path.split("/").at(-1) === file);

        if (key >= 0) {
            return `<a href="${data.keyDocuments[key].href}" data-document="${key}">${label}</a>`;
        }

        return /^https?:\/\//.test(target) ? `<a href="${target}" target="_blank" rel="noopener noreferrer">${label}</a>` : `<span class="reader-link" title="${target}">${label}</span>`;
    });

    return html.replace(/\u0000(\d+)\u0000/g, (_, number) => codes[Number(number)]);
}

async function loadTidy()
{
    try {
        tidyData = await fetchJson("/tidy");
        renderTidy();
    } catch {
        // the server is restarting: the next poll tries again
    }
}

function renderTidy()
{
    const box = document.getElementById("tidy");

    if (!box || !tidyData) {
        return;
    }

    const checked = new Set([...box.querySelectorAll("input[data-proposal]:checked")].map((input) => input.dataset.proposal));
    const { whitespace, undated, run, proposals = [], applied, running, lastTokens } = tidyData;
    const undatedCount = undated.reduce((sum, entry) => sum + entry.count, 0);
    const interrupted = run?.state === "running" && !running;
    const usage = run ? `${run.tokens ? ` · ${t("tidyTokens", Math.round(run.tokens / 1000))}` : ""}${run.cost ? `, ${t("tidyCost", run.cost.toFixed(2))}` : ""}` : "";
    const runLine = !run ? "" : running ? `<p class="hint"><span class="state starting" style="display:inline-block;margin-right:8px"></span>${escape(t("tidyRunning", run.kind, time(run.started)))}</p>`
        : interrupted ? `<p class="hint" style="color:var(--critical)">${escape(t("tidyInterrupted", time(run.started)))}</p>`
        : run.state === "failed" ? `<p class="hint" style="color:var(--critical)">${escape(t("tidyFailed", time(run.started), run.message))}</p>`
        : `<p class="hint">${escape(t("tidyLast", run.kind, time(run.finished)))}${run.kind === "apply" && applied ? "" : `: ${escape(run.message)}`}${escape(usage)}.</p>`;
    const harmless = run?.state === "done" && (run.kind === "propose" || applied?.applied.length > 0);
    const denials = run?.denials?.length
        ? `<p class="hint" ${harmless ? "" : 'style="color:var(--critical)"'}>${t(harmless ? "tidyHarmless" : "tidyDenied")}: ${run.denials.map((denial) => `<code>${escape(denial)}</code>`).join(", ")}.</p>`
        : "";
    const skipped = applied?.skipped.length ? t("tidySkipped", applied.skipped.length, applied.skipped.map((skip) => `${skip.id}: ${skip.why}`).join("; ")) : "";
    const appliedLine = denials + (applied ? `<p class="hint"><b>${t("tidyApplied")}</b> ${applied.applied.length}${escape(skipped)}. ${escape(applied.summary)}</p>` : "");
    const waiting = proposals.filter((proposal) => proposal.waits);
    const ready = proposals.filter((proposal) => !proposal.waits);
    const where = (proposal) => `<code>${escape(proposal.file)}${proposal.line ? `:${proposal.line}` : ""}</code>`;
    const waitingList = waiting.map((proposal) => `<li><b>${escape(proposal.title)}</b> <span class="badge">${escape(t("tidyWaits", proposal.waits))}</span><br>
            ${where(proposal)} · ${escape(proposal.why)}</li>`).join("");
    const list = ready.map((proposal) => `<li class="proposal">
            <label><input type="checkbox" data-proposal="${attribute(proposal.id)}" ${checked.has(proposal.id) ? "checked" : ""} ${running ? "disabled" : ""}>
            <span><b>${escape(proposal.title)}</b> <span class="badge">${escape(t("proposalKinds")[proposal.kind] ?? proposal.kind)}</span><br>
            ${where(proposal)} · ${escape(proposal.why)}<br>
            <span style="color:var(--ink)">${t("tidyChange")} ${escape(proposal.change)}</span></span></label>
        </li>`).join("");
    const cost = lastTokens ? t("tidyCostLast", Math.round(lastTokens / 1000)) : t("tidyCostUsual");

    box.innerHTML = `<div class="actions" style="flex-wrap:wrap;margin-bottom:14px">
            <button type="button" class="action" data-tidy="check">${t("tidyCheck")}</button>
            <button type="button" class="action" data-tidy="whitespace" ${whitespace.length ? "" : "disabled"}>${escape(t("tidyWhitespace", whitespace.length))}</button>
            <button type="button" class="action" data-tidy="dates" ${undatedCount ? "" : "disabled"}>${escape(t("tidyDates", undatedCount))}</button>
            <button type="button" class="action primary" data-tidy="propose" ${running ? "disabled" : ""}>${t("tidyPropose")}</button>
            <button type="button" class="action" data-tidy="backlog" ${running ? "disabled" : ""}>${t("tidyBacklog")}</button>
        </div>
        ${runLine}${appliedLine}
        ${ready.length ? `<ul class="list proposals">${list}</ul>
            <div class="actions" style="margin-top:12px"><button type="button" class="action primary" data-tidy="apply" ${running ? "disabled" : ""}>${t("tidyApply")}</button><button type="button" class="action" data-tidy="all" ${running ? "disabled" : ""}>${t("tidyAll")}</button></div>` : proposals.length ? `<p class="hint">${t("tidyNothingReady")}</p>` : ""}
        ${waiting.length ? `<h3 class="waiting-title">${t("tidyWaitingTitle")}</h3><p class="hint">${t("tidyWaitingHint")}</p><ul class="list">${waitingList}</ul>` : ""}`;

    box.querySelectorAll("[data-tidy]").forEach((button) => button.addEventListener("click", () => tidyAction(button.dataset.tidy, { whitespace, undated, cost })));
}

async function tidyAction(action, preview)
{
    if (action === "check") {
        lastData = "";
        await load();
        return;
    }

    if (action === "all") {
        document.querySelectorAll("input[data-proposal]").forEach((input) => (input.checked = true));
        return;
    }

    if (action === "whitespace" && confirm(t("tidyConfirmWhitespace", preview.whitespace.join("\n")))) {
        await post("/tidy/fix/whitespace");
    } else if (action === "dates" && confirm(t("tidyConfirmDates", preview.undated.map((entry) => `${entry.file}: ${entry.count}`).join("\n")))) {
        await post("/tidy/fix/dates");
    } else if (action === "propose" && confirm(t("tidyConfirmPropose", preview.cost))) {
        await post("/tidy/propose");
    } else if (action === "backlog" && confirm(t("tidyConfirmBacklog", preview.cost))) {
        await post("/tidy/propose?scope=backlog");
    } else if (action === "apply") {
        const ids = [...document.querySelectorAll("input[data-proposal]:checked")].map((input) => input.dataset.proposal);

        if (ids.length === 0) {
            alert(t("tidyTickFirst"));
        } else if (confirm(t("tidyConfirmApply", ids.length, ids.join(", ")))) {
            await post("/tidy/apply", { ids });
        }
    }

    await loadTidy();
    lastData = "";
    await load();
}

/** GET a JSON answer of the page's server; it throws when the server does not answer well. */
async function fetchJson(path)
{
    const response = await fetch(path);

    if (!response.ok) {
        throw new Error(`${path}: ${response.status} ${await response.text()}`);
    }

    return response.json();
}

/** POST to the page's server; the JSON answer, or null. A refusal other than "busy" (409) is shown to the user. */
async function post(path, payload)
{
    const response = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: payload ? JSON.stringify(payload) : undefined });
    const text = await response.text();

    if (!response.ok && response.status !== 409) {
        alert(t("failed", text));
        return null;
    }

    try {
        return JSON.parse(text);
    } catch {
        return null;
    }
}

function time(iso)
{
    return iso ? new Date(iso).toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" }) : "—";
}

function bindTabs()
{
    const buttons = [...document.querySelectorAll("#tabs [role=tab]")];

    buttons.forEach((button, index) => {
        button.addEventListener("click", () => selectTab(button));
        button.addEventListener("keydown", (event) => {
            const target = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: buttons.length - 1 }[event.key];

            if (target !== undefined) {
                event.preventDefault();
                const next = buttons[(target + buttons.length) % buttons.length];
                selectTab(next);
                next.focus();
            }
        });
    });
}

function selectTab(button)
{
    for (const other of document.querySelectorAll("#tabs [role=tab]")) {
        const selected = other === button;
        other.setAttribute("aria-selected", selected);
        other.tabIndex = selected ? 0 : -1;
        document.getElementById(other.getAttribute("aria-controls")).hidden = !selected;
    }

    history.replaceState(null, "", `#${button.id.slice("tab-".length)}`);
    scrollTo({ top: 0 });
}

function ring(percent, caption)
{
    const radius = 84;
    const length = 2 * Math.PI * radius;

    return `<div class="ring-wrap" role="img" aria-label="${attribute(t("ringLabel", percent))}">
        <svg viewBox="0 0 196 196" width="196" height="196">
            <circle cx="98" cy="98" r="${radius}" fill="none" stroke="var(--grid)" stroke-width="14"/>
            <circle class="ring-arc" cx="98" cy="98" r="${radius}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"
                transform="rotate(-90 98 98)" stroke-dasharray="${length}" stroke-dashoffset="${length}" data-offset="${length * (1 - percent / 100)}"/>
        </svg>
        <div class="value"><b>${percent}%</b><small>${escape(caption)}</small></div>
    </div>`;
}

/** A number with its label above and a line below, as the overview's tiles. */
function tile(label, number, sub)
{
    return `<div class="tile"><div class="label">${escape(label)}</div><div class="number">${escape(number)}</div><div class="sub">${escape(sub)}</div></div>`;
}

function progressBar(percent, complete)
{
    return `<div class="bar ${complete ? "done" : ""}"><i data-width="${percent}%"></i></div>`;
}

/** Stacked day bars on one shared axis: series are { name, color, values: { "YYYY-MM-DD": n } }. */
function dayBars(days, series, height)
{
    const width = 520;
    const left = 28;
    const bottom = 20;
    const plotHeight = height - bottom - 6;
    const totals = days.map((day) => series.reduce((sum, one) => sum + (one.values[day] ?? 0), 0));
    const top = niceMax(Math.max(1, ...totals));
    const slot = (width - left) / Math.max(1, days.length);
    const barWidth = Math.max(3, slot - 3);
    const y = (value) => 6 + plotHeight - (value / top) * plotHeight;
    let marks = "";

    days.forEach((day, index) => {
        let base = 0;
        const x = left + index * slot + (slot - barWidth) / 2;
        const lines = series.map((one) => `${escape(one.name)}: ${one.values[day] ?? 0}`).join("<br>");

        for (const [position, one] of series.entries()) {
            const value = one.values[day] ?? 0;

            if (value === 0) {
                continue;
            }

            const y1 = y(base + value);
            const y0 = y(base);
            const gap = position > 0 ? 2 : 0;
            marks += `<rect x="${x}" y="${y1}" width="${barWidth}" height="${Math.max(1, y0 - y1 - gap)}" rx="${Math.min(3, barWidth / 2)}" fill="${one.color}"/>`;
            base += value;
        }

        marks += `<rect x="${left + index * slot}" y="0" width="${slot}" height="${height - bottom}" fill="transparent" data-tip="${attribute(`<b>${formatDay(day)}</b>${lines}`)}"/>`;
    });

    const ticks = [0, top / 2, top].map((value) => `<line x1="${left}" x2="${width}" y1="${y(value)}" y2="${y(value)}" stroke="var(--grid)"/><text x="${left - 6}" y="${y(value) + 4}" text-anchor="end">${value}</text>`).join("");
    const labels = days.map((day, index) => (index % 7 === 0 ? `<text x="${left + index * slot + slot / 2}" y="${height - 4}" text-anchor="middle">${formatDay(day)}</text>` : "")).join("");
    const names = series.map((one) => one.name).join(` ${t("and")} `);

    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${attribute(t("perDay", names))}">${ticks}<line x1="${left}" x2="${width}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>${marks}${labels}</svg>`;
}

function priorityLabel(key)
{
    return key === "none" ? t("noPriority") : `${key} ${data.words.priorities[key] ?? ""}`.trim();
}

function taskOwnerRows(tasks, colleagues)
{
    const names = Object.fromEntries(colleagues.map((person) => [person.id, person.name]));
    const owners = [...new Set(tasks.map((task) => task.owner))].sort((first, second) => count(tasks, second) - count(tasks, first));
    const most = Math.max(1, ...owners.map((owner) => count(tasks, owner)));

    return owners.map((owner) => {
        const own = tasks.filter((task) => task.owner === owner);
        const label = names[owner] ?? owner;
        const segments = priorityOrder.map((key) => [key, own.filter((task) => (task.priority ?? "none") === key).length]).filter(([, value]) => value > 0)
            .map(([key, value]) => `<span style="flex:${value};background:${priorityColors[key]}" data-tip="${attribute(`<b>${escape(label)}: ${value} ${escape(priorityLabel(key))}</b>`)}"></span>`).join("");

        return `<div class="coverage-row"><div>${escape(label)}</div><div style="width:${(own.length / most) * 100}%"><div class="stack">${segments}</div></div><div style="text-align:right;color:var(--ink-2)">${own.length}</div></div>`;
    }).join("");
}

function count(tasks, owner)
{
    return tasks.filter((task) => task.owner === owner).length;
}

function ageBars(tasks)
{
    const bins = [[0, 3], [3, 7], [7, 14], [14, 21], [21, Infinity]];
    const labels = t("ageBins");
    const ages = tasks.filter((task) => task.created).map((task) => (Date.now() - new Date(`${task.created}T12:00:00`)) / 86400000);
    const values = bins.map(([from, to]) => ages.filter((age) => age >= from && age < to).length);
    const width = 520;
    const height = 200;
    const top = niceMax(Math.max(1, ...values));
    const slot = (width - 28) / bins.length;
    const y = (value) => 10 + (height - 40) * (1 - value / top);
    const bars = bins.map((_, index) => {
        const x = 28 + index * slot + slot * 0.18;
        const barHeight = Math.max(1, y(0) - y(values[index]));

        return `<rect x="${x}" y="${y(values[index])}" width="${slot * 0.64}" height="${barHeight}" rx="4" fill="var(--series-1)" data-tip="${attribute(`<b>${escape(labels[index])}</b>${escape(t("tasksCount", values[index]))}`)}"/>`
            + `<text x="${x + slot * 0.32}" y="${y(values[index]) - 6}" text-anchor="middle" style="fill:var(--ink-2)">${values[index]}</text>`
            + `<text x="${x + slot * 0.32}" y="${height - 12}" text-anchor="middle">${escape(labels[index])}</text>`;
    }).join("");

    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${attribute(t("ageLabel"))}"><line x1="28" x2="${width}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>${bars}</svg>`;
}

function urgentTasks(tasks, colleagues)
{
    const names = Object.fromEntries(colleagues.map((person) => [person.id, person.name.split(" ")[0]]));

    return tasks.filter((task) => task.priority === "P1").sort((first, second) => (first.created ?? "").localeCompare(second.created ?? ""))
        .map((task) => `<li><span class="tag" style="min-width:70px">${escape(names[task.owner] ?? task.owner)}</span><span style="color:var(--muted)">${formatDay(task.created)}</span> · <span class="clamp" style="display:inline">${escape(task.text)}</span></li>`).join("");
}

function colleagueCards(colleagues)
{
    const most = Math.max(1, ...colleagues.map((person) => person.open));

    return [...colleagues].sort((first, second) => second.open - first.open).map((person) => {
        const color = colors[person.color] ?? colors.gray;
        const portrait = person.hasPortrait ? `<img src="/portrait/${attribute(person.id)}" alt="">` : `<div class="avatar" style="background:${color}"></div>`;

        return `<div class="person" style="--person:${color}" data-tip="${attribute(`<b>${escape(person.name)}</b>${escape(person.role)}<br>${escape(t("crewTip", person.open, person.done))}`)}">
            ${portrait}
            <div style="min-width:0">
                <div class="name">${escape(person.name)}</div>
                <div class="role">${escape(person.role)}</div>
                <div class="bar"><i data-width="${(person.open / most) * 100}%"></i></div>
                <div class="open">${escape(t("crewOpen", person.open))}</div>
            </div>
        </div>`;
    }).join("");
}

function healthGroups(health)
{
    const kinds = [...new Set(health.map((finding) => finding.kind))];
    const marks = { error: ["var(--critical)", "✕"], warning: ["var(--warning)", "!"], note: ["var(--muted)", "·"] };
    const names = t("healthKinds");

    return kinds.map((kind) => {
        const group = health.filter((finding) => finding.kind === kind);
        const items = group.slice(0, 60).map((finding) => `<li><span style="color:${marks[finding.severity][0]};font-weight:700;display:inline-block;width:16px">${marks[finding.severity][1]}</span>${finding.file ? `<code>${escape(finding.file)}${finding.line ? `:${finding.line}` : ""}</code> ` : ""}${escape(finding.message)}</li>`).join("");
        const more = group.length > 60 ? `<li>${escape(t("healthMore", group.length - 60))}</li>` : "";

        return `<details class="section"><summary><div class="title"><b>${escape(names[kind] ?? kind)}</b></div><div></div><div class="count"></div><div class="pct">${group.length}</div></summary><ul class="list" style="margin:0 6px 12px">${items}${more}</ul></details>`;
    }).join("");
}

function numberingNote(decisions, prefix)
{
    const list = (numbers) => numbers.map((number) => `${prefix}-${number}`).join(", ");
    const warning = decisions.duplicates.length ? ` <span style="color:var(--critical)">⚠ ${escape(t("duplicates", list(decisions.duplicates)))}.</span>` : "";
    const gaps = decisions.missing.length ? ` ${escape(t("missing", list(decisions.missing)))}` : "";

    return warning + gaps;
}

/** Every day from the first one any of the value maps has to today, the axis all the day charts share. */
function dayRange(...maps)
{
    const all = maps.flat().flatMap((values) => Object.keys(values ?? {})).sort();
    const range = [];
    const end = new Date();

    for (let day = new Date(`${all[0] ?? new Date().toISOString().slice(0, 10)}T12:00:00`); day <= end; day.setDate(day.getDate() + 1)) {
        range.push(day.toISOString().slice(0, 10));
    }

    return range;
}

function sumSince(values, count)
{
    const since = new Date(Date.now() - count * 86400000).toISOString().slice(0, 10);

    return Object.entries(values).filter(([day]) => day > since).reduce((sum, [, value]) => sum + value, 0);
}

function niceMax(value)
{
    const step = 10 ** Math.floor(Math.log10(value));

    return [1, 1.5, 2, 2.5, 5, 10].map((factor) => factor * step).find((candidate) => candidate >= value) ?? value;
}

function ratio(done, total)
{
    return total > 0 ? Math.round((done / total) * 100) : 0;
}

/** A day, YYYY-MM-DD, as «29 Oct» in the page's language; «—» without one. */
function formatDay(day)
{
    if (!day) {
        return "—";
    }

    const [, month, date] = day.split("-").map(Number);

    return `${date} ${t("monthsShort")[month - 1]}`;
}

function relative(iso)
{
    const minutes = Math.round((Date.now() - new Date(iso)) / 60000);

    if (minutes < 60) {
        return t("minutesAgo", Math.max(0, minutes));
    }

    if (minutes < 48 * 60) {
        return t("hoursAgo", Math.round(minutes / 60));
    }

    return t("daysAgo", Math.round(minutes / 1440));
}

function escape(text)
{
    return String(text ?? "").replace(/[&<>"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[character]);
}

/** HTML for a data-tip attribute, whose text the tooltip shows as HTML. */
function attribute(html)
{
    return String(html ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function setupTheme()
{
    const saved = (() => {
        try {
            return localStorage.getItem("theme");
        } catch {
            return null;
        }
    })();

    if (saved) {
        document.documentElement.dataset.theme = saved;
    }

    document.getElementById("theme").addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        const next = dark ? "light" : "dark";
        document.documentElement.dataset.theme = next;

        try {
            localStorage.setItem("theme", next);
        } catch {
            // the choice lasts only this visit
        }
    });
}

function setupTooltip()
{
    const tip = document.getElementById("tip");

    document.addEventListener("mousemove", (event) => {
        const target = event.target.closest?.("[data-tip]");

        if (!target) {
            tip.style.opacity = 0;
            return;
        }

        tip.innerHTML = target.dataset.tip;
        tip.style.opacity = 1;
        const x = Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8);
        const y = event.clientY + 16 + tip.offsetHeight > innerHeight ? event.clientY - tip.offsetHeight - 10 : event.clientY + 16;
        tip.style.left = `${x}px`;
        tip.style.top = `${y}px`;
    });
}
